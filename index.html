<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>問いを深める対話コーチ | 自分の問いを育てる</title>
<meta name="description" content="自分の思いを見つけ、別の見方を試し、本質的な問いを育てる。API・登録不要の学習Webアプリ。">
<style>
:root{--navy:#18364c;--blue:#266e8f;--light:#f5f8f7;--muted:#647782;--line:#dce7e7;--mint:#d9ede8;--gold:#f7ebd1;--white:#fff;--shadow:0 16px 45px rgba(22,53,69,.07)}
*{box-sizing:border-box}body{margin:0;color:var(--navy);font-family:"BIZ UDPGothic","Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:radial-gradient(circle at 100% 0,#e3f3ed 0,transparent 36%),linear-gradient(180deg,#f8faf9,#eff5f4);min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #e6a747;outline-offset:3px}.app{width:min(900px,calc(100% - 34px));margin:0 auto;padding:27px 0 72px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:15px}.brand-mark{display:grid;place-items:center;background:var(--navy);color:white;width:41px;height:41px;border-radius:14px;font-size:24px}.top-note{font-size:12px;color:var(--muted)}.hero{padding:38px 35px;background:linear-gradient(120deg,#18364c 0%,#276079 100%);color:white;border-radius:27px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:'？';position:absolute;right:5%;top:-45px;font-size:240px;line-height:1;opacity:.08;font-weight:900;pointer-events:none}.eyebrow{font-size:12px;letter-spacing:.13em;font-weight:800;opacity:.85}.hero h1{font-size:clamp(25px,4vw,39px);line-height:1.4;margin:8px 0 12px}.hero p{max-width:620px;font-size:15px;line-height:1.9;margin:0;color:#e7f1f4}.stage-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:26px 0 14px}.pill{font-size:12px;border-radius:30px;padding:8px 12px;background:white;border:1px solid var(--line);color:var(--muted)}.pill.active{background:var(--navy);color:white;border-color:var(--navy)}.pill.done{background:#ddefe9;color:#175d50;border-color:#ddefe9}.card{background:white;border:1px solid #e4eceb;box-shadow:var(--shadow);border-radius:24px;padding:clamp(22px,4vw,37px);margin-top:14px}.minor{font-size:12px;color:#52768a;font-weight:800;letter-spacing:.07em}.question{font-size:clamp(22px,3vw,30px);line-height:1.63;margin:13px 0 12px;font-weight:800}.help{font-size:14px;line-height:1.85;color:#586f79;margin:0 0 23px}.option-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{text-align:left;padding:17px 17px;min-height:74px;border:2px solid var(--line);background:#fff;border-radius:16px;color:var(--navy);font-size:15px;line-height:1.65;font-weight:700;transition:.18s}.choice:hover{border-color:#94c5c5;background:#f7fbfa}.choice.selected{border-color:#347e8e;background:#e9f6f2;box-shadow:inset 0 0 0 1px #347e8e}.choice small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:4px}.field-label{display:block;font-size:13px;font-weight:800;margin:20px 0 8px}.field{width:100%;border-radius:13px;padding:14px 15px;border:1.5px solid #cfdcdb;background:#fcfdfd;color:var(--navy);font-size:15px;outline:none}.field:focus{border-color:#347e8e}.field::placeholder{color:#92a2a7}.memo-details{margin-top:20px;border-top:1px solid var(--line);padding-top:18px}.memo-details summary{cursor:pointer;font-size:13px;color:#3c7285;font-weight:800}.memo-details textarea{margin-top:11px;min-height:84px;resize:vertical}.notice{font-size:12px;line-height:1.8;color:var(--muted)}.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:25px;flex-wrap:wrap}.primary,.secondary,.ghost{border-radius:13px;padding:14px 22px;font-size:14px;font-weight:800;min-height:49px;border:1px solid transparent}.primary{background:var(--navy);color:#fff}.primary:hover{background:#2a5973}.secondary{background:#e7f2ef;color:#19566c}.ghost{background:white;color:var(--muted);border-color:var(--line)}.primary:disabled{opacity:.38;cursor:not-allowed}.progress{display:flex;align-items:center;justify-content:space-between;margin-top:18px;font-size:12px;color:var(--muted)}.track{width:100%;height:7px;background:#dfebeb;border-radius:10px;overflow:hidden;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,#71bdb1,#26728c);transition:width .3s}.reflection{background:#f4f8f6;border-radius:15px;padding:18px;margin-bottom:17px;border-left:4px solid #62a5a3;font-size:14px;line-height:1.9}.reflection strong{display:block;margin-bottom:4px}.summary-steps{display:grid;gap:12px}.summary-item{border:1px solid var(--line);border-radius:14px;padding:17px;background:#fafdfe}.summary-item span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:800}.summary-item p{margin:0;line-height:1.7;font-size:15px}.output{background:#e9f4f0;border-radius:16px;padding:23px;margin-top:21px}.output h3{font-size:15px;margin:0 0 10px}.output p{line-height:1.9;font-size:19px;font-weight:800;margin:0}.foot{margin-top:27px;text-align:center;color:#6c848c;font-size:12px;line-height:1.9}.hidden{display:none!important}.counter{margin-top:3px;font-size:12px;color:#81919b}.intro-points{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:19px}.intro-points>div{border:1px solid var(--line);border-radius:14px;padding:16px;background:#f9fcfb}.intro-points b{display:block;font-size:14px;margin:6px 0}.intro-points span{font-size:12px;color:var(--muted);line-height:1.6}.tiny{font-size:11px;color:var(--muted);line-height:1.7}.restart{color:#4b7a88;text-decoration:underline;border:0;background:transparent;font-size:12px;padding:10px}.choice.disabled{opacity:.5}.result-top{display:flex;gap:12px;align-items:center}.result-icon{font-size:25px}.output input{margin-top:10px}.skip-info{background:var(--gold);border-radius:12px;padding:12px 15px;font-size:13px;line-height:1.7;margin-top:13px}.fadein{animation:up .2s ease both}@keyframes up{from{transform:translateY(8px);opacity:.5}to{transform:translateY(0);opacity:1}}@media(max-width:620px){.app{width:min(100% - 24px,900px);padding-top:16px}.hero{padding:27px 23px;border-radius:20px}.card{padding:23px 18px}.option-grid{grid-template-columns:1fr}.intro-points{grid-template-columns:1fr}.top-note{display:none}.actions{gap:8px}.actions button{flex:1}.choice{min-height:60px}.hero:after{font-size:160px;top:0}}@media print{body{background:white}.hero,.top,.stage-line,.actions,.foot,.progress,button,.memo-details{display:none!important}.app{padding:0;width:100%}.card{box-shadow:none;border:0;padding:0}}
.choice:active{transform:scale(.99)}.field{line-height:1.7}.reflection strong{font-size:13px}#probe{border-left-color:#c59245;background:#fffbef}textarea{resize:vertical} .choice{touch-action:manipulation}@media(prefers-reduced-motion:reduce){.fadein{animation:none}.fill{transition:none}}
  </style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><span class="brand-mark">?</span><span>問いを深める対話コーチ</span></div><span class="top-note">選ぶ → 揺さぶる → 自分の問いを育てる</span></header>
<section class="hero"><div class="eyebrow">THINKING JOURNEY</div><h1>その「気になる」を、<br>自分だけの問いに。</h1><p>正解を急がず、思いを確かめ、別の見方を試す。選択肢をタップするだけでも進める、問いを育てる小さな旅。</p></section>
<div class="stage-line" aria-label="学習の段階"><span id="stage0" class="pill active">はじめに</span><span id="stage1" class="pill">① 明確にする</span><span id="stage2" class="pill">② 揺さぶる</span><span id="stage3" class="pill">③ 本質に迫る</span><span id="stage4" class="pill">振り返る</span></div>
<main id="screen" aria-live="polite"></main>
<div class="foot">回答に正解・不正解はありません。入力内容はサーバーに送信されません。<br>対話を通して、自分の考えを深めるための学習アプリです。</div>
</div>
<script>
'use strict';
// API, external libraries, accounts and server communications are deliberately not used.
const qs=document.querySelector('#screen');
const state={page:-1,answers:[],memo:[],topic:'',topicCustom:'',lastQuestion:'',finished:false, mode:'standard'};
const topicOptions=[['授業・学び','学校や学びのこと'],['自分のこと','自分の考えや目標'],['友達・人との関わり','人間関係や対話'],['社会・くらし','地域や身近な問題'],['仕事・活動','働き方やチーム'],['まだ分からない','もやもやしていること']];
const steps=[
 {stage:1,label:'思いを見つける',title:s=>`「${s.topic}」について、今いちばん気になっているのは何ですか？`,help:'自分の気持ちに近いものを選びましょう。ぴったりでなくても大丈夫。',options:[['困っていることがある','課題・困りごと'],['もっと良くしたい','改善したいこと'],['なぜだろうと思う','疑問・違和感'],['大切にしたいものがある','願い・価値'],['まだ言葉にしにくい','もやもや']]},
 {stage:1,label:'場面を見つける',title:s=>`「${clip(val(0),15)}」と感じるのは、どんなときですか？`,help:'頭に浮かぶ出来事や場面を選んでみましょう。',options:[['実際に見聞きしたとき','具体的な出来事'],['自分が体験したとき','自分の経験'],['誰かの話を聞いたとき','他者との対話'],['思い通りにいかなかったとき','困った場面'],['これからを想像したとき','未来への想像']]},
 {stage:1,label:'願いを見つける',title:s=>`その先で、あなたは何が実現するといいと思いますか？`,help:'何が「よくなった」と感じられるか、願いに近いものを選びましょう。',options:[['誰もが安心できる','安心'],['もっと楽しく・夢中になれる','楽しさ・意欲'],['自分で考え選べる','主体性'],['理解や成長が深まる','学び・成長'],['人とつながれる','つながり'],['よりよい仕組みができる','仕組みの改善']]},
 {stage:2,label:'前提を確かめる',title:s=>`「${clip(val(0),21)}」という思いには、どんな前提がありそうですか？`,help:'自分の考えが成り立っている「当たり前」を少し離れて見てみましょう。',options:[['みんなも同じように感じるはず','みんな同じとは限らない'],['やり方は一つだと思っている','方法は一つとは限らない'],['今の状態は変えにくいと思う','変えられる条件はある'],['新しいことが必ずよいと思う','新しさだけが価値ではない'],['どれとも違う','前提はまだ分からない']]},
 {stage:2,label:'別の視点に立つ',title:s=>`もし別の立場から「${clip(s.topic,19)}」を見たら、何が違って見えるでしょう？`,help:'自分とは違う視点を一つ選んで考えてみましょう。',options:[['困っている人の視点','困っている人'],['うまくいっている人の視点','うまくいっている人'],['反対の意見を持つ人の視点','異なる意見の人'],['初めて取り組む人の視点','初めての人'],['未来の自分の視点','未来の自分']]},
 {stage:2,label:'問いを組み替える',title:s=>`今考えると、本当に変えたいのは「何」でしょうか？`,help:'最初の問題から一歩離れ、「変える対象」を問い直します。',options:[['人の考え方や気持ち','意識・気持ち'],['学び方や行動','行動・体験'],['環境やしくみ','環境・仕組み'],['ものの見方や判断基準','見方・基準'],['問題の捉え方そのもの','問いの立て方']]},
 {stage:2,label:'例外から考える',title:s=>`「${clip(val(5),20)}」以外の方法でも、願いを実現できる場面はないでしょうか？`,help:'自分と反対の考えが成り立つ条件を探すと、問いの焦点が変わることがあります。',options:[['別の方法でも実現できそう','方法は複数ある'],['人によって必要な方法が違う','人による違い'],['状況や条件によって変わる','条件による違い'],['そもそも目的が違うかもしれない','目的の違い'],['まだ例外が思いつかない','例外は未発見']]},
 {stage:3,label:'確かめる基準を考える',title:s=>`「${clip(val(2),16)}」が実現したと、何を見れば分かりそうですか？`,help:'願いを、観察できる変化や確かめられる根拠に結び付けましょう。',options:[['行動が変わっている','行動の変化'],['自分の言葉で説明できる','説明・理解の変化'],['取り組みたい気持ちが見える','意欲の変化'],['結果や成果が変わっている','成果の変化'],['関係性や雰囲気が変わっている','関係性の変化']]},
 {stage:3,label:'次の一歩を考える',title:s=>`その変化を確かめるために、最初にできる小さなことは何でしょう？`,help:'立派な計画でなくて構いません。無理なく試せそうなことを選びます。',options:[['一人の声を聞く','声を聞く'],['身近な場面を観察する','観察する'],['小さく試してみる','試してみる'],['情報や事例を調べる','調べる'],['誰かと問いを共有する','共有する']]}
];
function clip(x,n){x=(x||'そのこと').replace(/\s+/g,' ');return x.length>n?x.slice(0,n)+'…':x}
function val(i){return state.answers[i]?.text||''}
function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function currentStage(){return state.page<0?0:state.page>=steps.length?4:steps[state.page].stage}
function renderNav(){for(let i=0;i<=4;i++){const el=document.querySelector('#stage'+i);el.className='pill'+(currentStage()===i?' active':currentStage()>i?' done':'')}}
function render(){renderNav();if(state.page===-1)return renderIntro();if(state.page>=steps.length)return renderResult();renderStep()}
function renderIntro(){qs.innerHTML=`<section class="card fadein"><div class="minor">START / テーマを選ぶ</div><h2 class="question">今、あなたの心にある「気になること」は？</h2><p class="help">まずテーマを一つ選びましょう。話題を決められなくても始められます。</p><div class="option-grid" id="choices">${topicOptions.map((x,i)=>`<button class="choice${state.topic===x[0]?' selected':''}" data-index="${i}" aria-pressed="${state.topic===x[0]}">${safe(x[0])}<small>${safe(x[1])}</small></button>`).join('')}</div><label class="field-label" for="customTopic">自分のテーマ（任意）</label><input id="customTopic" class="field" maxlength="120" placeholder="例：教師が新しいことに挑戦するには？" value="${safe(state.topicCustom)}"><p class="tiny">書かなくても進められます。個人名や秘密の情報は入力しないでください。</p><div class="intro-points"><div><span>STEP 1</span><b>思いを明確に</b><span>気になることと願いを見つける</span></div><div><span>STEP 2</span><b>考えを揺さぶる</b><span>前提を疑い、見方を変える</span></div><div><span>STEP 3</span><b>本質に迫る</b><span>確かめ方と次の一歩を考える</span></div></div><div class="actions"><span class="notice">一度に一問ずつ進みます。</span><button class="primary" id="start">問いを育てはじめる →</button></div></section>`;
qs.querySelectorAll('[data-index]').forEach(btn=>btn.onclick=()=>{state.topic=topicOptions[+btn.dataset.index][0];qs.querySelectorAll('[data-index]').forEach(el=>{const active=el===btn;el.classList.toggle('selected',active);el.setAttribute('aria-pressed',String(active))})});
qs.querySelector('#customTopic').oninput=e=>{state.topicCustom=e.target.value};qs.querySelector('#start').onclick=()=>{state.topic=state.topicCustom.trim()||state.topic||'今、気になっていること';state.page=0;render();scrollTop()};}
function renderStep(){let s=steps[state.page],saved=state.answers[state.page],selected=saved?.key??-1;const completed=state.page+1;const stageNo=s.stage;const reflect=state.page===3?`<div class="reflection"><strong>ここまでの気付き</strong>最初は「${safe(state.topic)}」。そこから「${safe(val(2)||'実現したい姿')}」という願いが見えてきました。ここからは、今の考えに別の光を当てます。</div>`:state.page===7?`<div class="reflection"><strong>ここからは本質に迫ります</strong>考えを変えること自体が目的ではありません。「何を見れば確かめられるか」まで問いを進めてみましょう。</div>`:'';
qs.innerHTML=`<section class="card fadein"><div class="minor">STAGE ${stageNo} ・ ${safe(s.label)}</div><div class="progress"><span>${stageNo===1?'思いの明確化':stageNo===2?'視点の転換':'本質の探究'}</span><span>${completed} / ${steps.length} 問</span></div><div class="track"><div class="fill" style="width:${Math.round(100*completed/steps.length)}%"></div></div><h2 class="question">${safe(adaptivePrompt()||s.title(state))}</h2><p class="help">${safe(s.help)}</p>${reflect}<div class="option-grid" id="choices">${s.options.map((o,i)=>`<button class="choice ${selected===i?'selected':''}" data-index="${i}" aria-pressed="${selected===i}">${safe(o[0])}</button>`).join('')}</div><div id="probe" class="reflection" style="display:${selected>=0?'block':'none'};margin-top:14px" aria-live="polite"><strong>もう一歩、考えるヒント</strong><span id="probeText">${safe(selected>=0?followup(state.page,selected):'')}</span></div><label class="field-label" for="customAnswer">自分の言葉で答える（任意）</label><input class="field" id="customAnswer" maxlength="160" value="${safe(saved?.custom||'')}" placeholder="選択肢にない考えがあれば、ここへ"><details class="memo-details" ${state.memo[state.page]?'open':''}><summary>✎ メモを残す（任意）</summary><textarea class="field" id="memo" maxlength="1500" placeholder="気付いたこと・思いついたことなど。空欄でも進めます。">${safe(state.memo[state.page]||'')}</textarea><p class="tiny">メモはこの端末の画面上だけで扱われます。後でテキスト保存できます。</p></details><div class="actions"><button class="ghost" id="back">← 戻る</button><button class="secondary" id="skip">今は決めずに進む</button><button class="primary" id="next">次の問いへ →</button></div>${state.page>=3?'<p class="tiny">違う見方を選んでも、それに賛成する必要はありません。</p>':''}</section>`;
let currentKey=selected;const answerInput=qs.querySelector('#customAnswer');qs.querySelectorAll('[data-index]').forEach(btn=>btn.onclick=()=>{currentKey=+btn.dataset.index;qs.querySelectorAll('[data-index]').forEach(b=>{b.classList.toggle('selected',b===btn);b.setAttribute('aria-pressed',String(b===btn))});const probe=qs.querySelector('#probe');probe.style.display='block';qs.querySelector('#probeText').textContent=followup(state.page,currentKey)});
function save(skip=false){const custom=answerInput.value.trim(),opt=currentKey>=0?s.options[currentKey]:null;const txt=custom||opt?.[0]||(skip?'まだ決めていない':'これから考えたい');state.answers[state.page]={key:currentKey,custom,text:txt,tag:opt?.[1]||'',skipped:skip};state.memo[state.page]=qs.querySelector('#memo')?.value||''}
qs.querySelector('#back').onclick=()=>{if(state.page===0){state.page=-1}else{save(true);state.page--}render();scrollTop()};
qs.querySelector('#skip').onclick=()=>{save(true);state.page++;render();scrollTop()};qs.querySelector('#next').onclick=()=>{save();state.page++;render();scrollTop()};}
function generateQuestion(){
 const change=state.answers[5]?.tag||'今の取り組み';
 const wish=state.answers[2]?.tag||'大切にしたい願い';
 const lens=state.answers[4]?.tag||'別の立場';
 const nuance=state.answers[6]?.tag||'異なる条件';
 const criterion=state.answers[7]?.tag||'観察できる変化';
 const goal=clip(state.topic,46);
 return `「${goal}」について、${lens}や${nuance}にも目を向けながら、${change}をどう見直せば「${wish}」に近づけるのだろう？ それを${criterion}からどう確かめられるだろうか？`;
}
function followup(step,index){
 const prior=state.answers.slice(0,step).map(a=>a?.tag).filter(Boolean);
 const base=[
  ['その気持ちが一番強くなるのは、どんな瞬間？','それが変わったら、何が違う？','「なぜ？」をもう一度だけ問うと？','その願いを大切にする理由は？','まだ名前のない気持ちに、色や形をつけるなら？'],
  ['その場面で、誰が何をしていた？','前と後で自分の見方は変わった？','別の人も同じように感じていただろうか？','うまくいった場面との違いは？','もし未来から見たら、その出来事はどう見える？'],
  ['安心が生まれたと、何を見れば分かる？','楽しいだけでなく、学びの深まりはどう確かめる？','自分で決めることと支援を受けることは両立する？','成長は誰にとっての成長だろう？','つながりを必要としない人もいる？','仕組みを変えずにできることは？'],
  ['本当にみんな同じだろうか？','別の方法がうまくいく例は？','変えられる部分と変えにくい部分は？','新しい方法が向かないのはどんな場合？','まだ気付いていない前提を一つ想像すると？'],
  ['その人は何に困っている？','その人が大切にしてきた成功体験は？','反対意見にも理由があるとしたら？','最初の一歩で何が不安だろう？','5年後にも大切なことは？'],
  ['考えを変えなくても改善できる？','体験だけで行動が変わるだろうか？','仕組みが変わっても残る課題は？','誰の基準で「よい」と判断する？','問いの立て方自体を変えたら？'],
  ['別の方法が適切なのはどんな場面？','必要な支援が異なる人は誰？','どんな条件なら逆の選択がよい？','本来の目的は何だった？','例外を見つけるには何を観察する？'],
  ['行動の変化はいつ・どこで見える？','説明が上達したことをどう確かめる？','楽しさと学びを混同していない？','成果以外に見るべき変化は？','見えにくい変化はどう捉える？'],
  ['まず誰に聞く？','どの場面で何を観察する？','失敗しても安全な小さな実験は？','どんな情報があれば考えが変わる？','誰とどんな問いを共有する？']
 ];
 return (base[step]||[])[index]||'違う立場からもう一度考えると？';
}
function adaptivePrompt(){
 const n=state.page, a=state.answers;
 if(n===1 && a[0])return `さきほど「${clip(a[0].text,27)}」と答えました。どんな経験がその気持ちにつながったのでしょう？`;
 if(n===2 && a[1])return `「${clip(a[1].text,27)}」という場面で、本当に大切にしたかったのは何でしょう？`;
 if(n===3 && a[2])return `大切にしたいのは「${clip(a[2].text,25)}」。そのためには、現在の考えのどこを疑ってみるとよいでしょう？`;
 if(n===4 && a[3])return `「${clip(a[3].text,28)}」という見直しをしたら、違う立場の人は何と言うでしょう？`;
 if(n===5 && a[4])return `「${clip(a[4].text,27)}」の視点から考えると、本当に変えるべきものは何でしょう？`;
 if(n===6 && a[5])return `「${clip(a[5].text,27)}」を変える以外にも、願いをかなえる方法はあるでしょうか？`;
 if(n===7 && a[6])return `「${clip(a[6].text,25)}」と考えたとき、何を根拠に確かめればよいでしょう？`;
 if(n===8 && a[7])return `「${clip(a[7].text,25)}」を確かめるなら、小さく始められることは？`;
 return '';
}
function report(){const s=['問いを深める対話コーチ｜振り返り','',`出発点：${state.topic}`,'',...steps.map((v,i)=>`【${v.label}】\n問い：${v.title(state)}\n答え：${val(i)||'未回答'}${state.memo[i]?`\nメモ：${state.memo[i]}`:''}`),'',`新しい問い（たたき台）：${document.querySelector('#refined')?.value||generateQuestion()}`,'','※正解や診断結果ではなく、本人の選択をもとにした整理です。'];return s.join('\n')}
function renderResult(){const q=state.lastQuestion||generateQuestion();qs.innerHTML=`<section class="card fadein"><div class="minor">REFLECTION / 振り返り</div><div class="result-top"><div class="result-icon">✧</div><h2 class="question">あなたの問いは、どう変わった？</h2></div><p class="help">答えを決めるためではなく、次に考えたい問いを見つけるための振り返りです。</p><div class="summary-steps"><div class="summary-item"><span>出発点</span><p>${safe(state.topic)}</p></div><div class="summary-item"><span>第1段階で見つけた願い</span><p>${safe(val(2)||'まだ言葉にしている途中')}</p></div><div class="summary-item"><span>第2段階で取り入れた視点</span><p>${safe(val(3)||'前提の見直し')} ／ ${safe(val(4)||'別の立場')} ／ ${safe(val(5)||'変える対象')} ／ ${safe(val(6)||'例外・条件')}</p></div><div class="summary-item"><span>第3段階で考えた確かめ方</span><p>${safe(val(7)||'未選択')} ／ 次の一歩：${safe(val(7)||'未選択')}</p></div></div><div class="output"><h3>新しく育った問い（編集できます）</h3><textarea id="refined" class="field" rows="4" maxlength="500">${safe(q)}</textarea><p class="tiny">これは選んだ言葉をもとに組み立てた「たたき台」です。違和感があるところは、自分らしい言葉に書き換えてください。</p></div><div class="actions"><button class="ghost" id="back">← 一つ前へ</button><button class="secondary" id="copy">振り返りをコピー</button><button class="primary" id="download">テキストで保存 ↓</button></div><div class="skip-info">もっと深めたいときは、編集した「新しい問い」を次の出発点としてもう一度ノックできます。</div><div class="actions"><button class="secondary" id="again">この問いでもう一度深める ↻</button><button class="ghost" id="print">印刷</button><button class="restart" id="reset">最初からやり直す</button></div></section>`;
const refined=qs.querySelector('#refined');refined.oninput=()=>state.lastQuestion=refined.value;
qs.querySelector('#back').onclick=()=>{state.lastQuestion=refined.value;state.page=steps.length-1;render();scrollTop()};qs.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(report());buttonFlash('#copy','コピーしました')}catch(e){refined.focus();refined.select();alert('この環境では自動コピーできません。問いを選択してコピーしてください。')}};
qs.querySelector('#download').onclick=()=>{const blob=new Blob(['\ufeff'+report()],{type:'text/plain;charset=utf-8'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='問いの振り返り.txt';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),500)};
qs.querySelector('#again').onclick=()=>{const t=refined.value.trim()||generateQuestion();if(!confirm('新しい問いを出発点にして、もう一度考えますか？（今の回答は画面から消えます。必要なら先に保存してください）'))return;state.topic=t;state.topicCustom=t;state.answers=[];state.memo=[];state.page=0;state.lastQuestion='';render();scrollTop()};qs.querySelector('#reset').onclick=()=>{if(!confirm('最初からやり直しますか？ 今の回答は消えます。'))return;state.page=-1;state.answers=[];state.memo=[];state.topic='';state.topicCustom='';state.lastQuestion='';render();scrollTop()};qs.querySelector('#print').onclick=()=>window.print();}
function buttonFlash(selector,text){let b=qs.querySelector(selector);const old=b.textContent;b.textContent=text;setTimeout(()=>{if(b.isConnected)b.textContent=old},1700)}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}
render();
</script>
