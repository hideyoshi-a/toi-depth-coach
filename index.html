<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="選ぶ・予想する・比べる・問い直す。思考を引き出す問いの探究Webアプリ。個人情報の送信やログインはありません。"><title>問いの探究ラボ｜問いを深める対話コーチ</title>
<style>
:root{color-scheme:light;--ink:#19354a;--sub:#566e79;--accent:#146d74;--accent2:#effaf5;--edge:#d7e5e7;--bg:#f3f8f8;--card:white;--amber:#fff5dc;--focus:#d6820c}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"BIZ UDPGothic","Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:radial-gradient(ellipse at top right,#d9f2e7,transparent 42%),var(--bg);color:var(--ink)}button,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:3px}button:disabled{opacity:.48;cursor:not-allowed}.shell{max-width:1000px;padding:18px 16px 58px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.logo{font-weight:900;display:flex;align-items:center;gap:9px}.logo i{display:grid;place-items:center;background:var(--ink);color:white;width:40px;height:40px;border-radius:13px;font-size:24px;font-style:normal}.muted{color:var(--sub)}.micro{font-size:12px;line-height:1.75}.hero{background:linear-gradient(120deg,#17384c,#246b72);color:white;border-radius:23px;padding:28px 30px;position:relative;overflow:hidden}.hero:after{content:'？';font-weight:900;font-size:160px;opacity:.08;position:absolute;right:20px;top:-30px;pointer-events:none}.hero small{font-weight:800;letter-spacing:.16em;color:#bde3dd}.hero h1{font-size:clamp(24px,3.5vw,36px);margin:8px 0;line-height:1.48}.hero p{font-size:14px;line-height:1.85;color:#e2f3f1;max-width:680px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.chip{background:white;border:1px solid var(--edge);border-radius:30px;padding:8px 11px;font-size:12px;color:var(--sub)}.chip.current{background:var(--ink);color:white}.chip.completed{background:#e0f2ec;color:#186257}.panel{background:var(--card);border:1px solid var(--edge);box-shadow:0 9px 34px #2048510a;border-radius:22px;padding:clamp(19px,4vw,32px)}.eyebrow{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.07em}.question{font-size:clamp(20px,3vw,27px);line-height:1.62;margin:11px 0}.lead{line-height:1.85;color:var(--sub);font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pick{border-radius:15px;border:2px solid var(--edge);padding:15px 15px;text-align:left;background:#fff;color:var(--ink);line-height:1.65;font-weight:700;min-height:66px}.pick[aria-pressed="true"]{background:#e6f7ef;border-color:var(--accent)}.pick:hover{border-color:#64aba9}.pick .mini{display:block;font-size:12px;color:var(--sub);font-weight:400;margin-top:4px}.actions{display:flex;gap:9px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:22px}.btn{padding:12px 17px;border-radius:12px;border:1px solid var(--edge);background:#fff;color:var(--ink);font-size:14px;font-weight:800;min-height:48px}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.soft{background:#e6f4ef;color:#19565d}.hint{background:var(--amber);padding:13px 15px;border-radius:12px;font-size:13px;line-height:1.8;margin:14px 0}.insight{background:#eef7f7;border-left:4px solid #56a49c;border-radius:11px;padding:15px;margin:15px 0;line-height:1.85;font-size:14px}.meter{height:7px;background:#e6edef;border-radius:10px;overflow:hidden;margin:12px 0}.meter div{height:100%;background:#26857e;transition:width .25s}.steps{display:flex;justify-content:space-between;gap:8px;color:var(--sub);font-size:12px}.memo{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--edge)}.memo summary{font-size:13px;color:#27616e;cursor:pointer;font-weight:800}.memo textarea,.edit{width:100%;display:block;margin-top:10px;min-height:76px;border:1px solid #b9cfd0;border-radius:12px;padding:13px;background:#fbfefe;color:var(--ink);line-height:1.75;resize:vertical}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{border:1px solid var(--edge);border-radius:15px;padding:17px;background:#fbfefd}.tile strong{display:block;margin-bottom:9px}.tile .big{font-size:18px;line-height:1.7;font-weight:800}.tile p{font-size:13px;line-height:1.75;color:var(--sub)}.compare{border-radius:15px;border:1px solid var(--edge);padding:17px}.compare b{display:block;font-size:12px;color:var(--sub);margin-bottom:7px}.compare p{font-weight:700;line-height:1.85;margin:0}.arrow{text-align:center;font-size:26px;color:var(--accent);padding:6px}.status{font-size:13px;color:var(--accent);min-height:1.5em}.footer{text-align:center;font-size:12px;line-height:1.85;color:var(--sub);margin:24px auto}.stage-title{font-size:13px;color:var(--sub);margin:0 0 9px}.checks{display:grid;gap:9px}.line{border-top:1px solid var(--edge);margin:20px 0}.hidden{display:none}.progress-text{font-weight:700;color:var(--accent)}@media(max-width:640px){.grid,.cards{grid-template-columns:1fr}.hero{padding:24px 21px}.shell{padding:12px 12px 42px}.actions .btn{flex:1}.top .micro{display:none}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.meter div{transition:none}}@media print{body{background:white}.hero,.top,.chips,.actions,.memo,.footer,.meter{display:none!important}.shell{padding:0}.panel{border:0;box-shadow:none;padding:8px}.compare{break-inside:avoid}}
</style></head><body><div class="shell"><header class="top"><div class="logo"><i>?</i> 問いの探究ラボ <span class="micro muted">｜問いを深める対話コーチ</span></div><span class="micro muted">選ぶ・試す・見直す</span></header><section class="hero"><small>QUESTION EXPLORATION LAB</small><h1>「そう思う」を、<br>「本当に？」に変えてみよう。</h1><p>答えを覚えるのではなく、自分の考えを動かす学習アプリ。予想・比較・反例・条件変更を通じて、自分だけの問いを育てます。</p></section><nav class="chips" id="nav" aria-label="探究ステップ"></nav><main class="panel" id="app" aria-live="polite"></main><footer class="footer">名前・学校名・個人を特定できる情報は入力しないでください。記入は任意です。<br>回答は端末内で処理され、外部へ送信されません。</footer></div>
<script>
'use strict';(()=>{
const el=document.getElementById('app'),nav=document.getElementById('nav');
const themes=[['学校・授業','学び方や授業をもっとよくしたい'],['友達・人との関わり','違う考えの人とどう関わる？'],['自分の成長','自分の得意・苦手や目標'],['社会・くらし','身近な不思議や改善したいこと'],['仕事・チーム','協働や新しい挑戦'],['自由テーマ','まだはっきりしない思い']];
const goals=[['楽しく取り組める','わくわくする姿'],['自分で考えられる','自ら考え選ぶ姿'],['安心して挑戦できる','失敗しても挑戦できる姿'],['根拠を説明できる','考えを説明できる姿'],['人と協力できる','他者と学び合う姿'],['よい変化が生まれる','実際の変化が見られる姿']];
const st={page:0,theme:0,focus:null,goal:null,assumption:null,lens:null,exception:null,measure:null,action:null,notes:{},deep:false,rewritten:'',branch:0};
const panels=['出発点','思いを明確化','予想と揺さぶり','条件を変える','本質を探る','振り返り'];
const quote=(x,n=40)=>{let t=String(x||'そのこと');return t.length>n?t.slice(0,n)+'…':t};
const safe=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const words=()=>({t:themes[st.theme][0],f:st.focus===null?'もっとよくしたいこと':['気になること','困っていること','変えたいこと','意外に思うこと','まだよく分からないこと'][st.focus],g:st.goal===null?'実現したい姿':goals[st.goal][1]});
function reset(){Object.assign(st,{page:0,theme:0,focus:null,goal:null,assumption:null,lens:null,exception:null,measure:null,action:null,notes:{},deep:false,rewritten:'',branch:0});render()}
function go(n){saveNote();st.page=Math.max(0,Math.min(5,n));render();el.scrollIntoView({behavior:'smooth',block:'start'})}
function saveNote(){let a=el.querySelector('#memo');if(a)st.notes[st.page]=a.value}
function chip(){nav.innerHTML=panels.map((p,i)=>`<span class="chip ${i===st.page?'current':i<st.page?'completed':''}">${i+1}. ${p}</span>`).join('')}
function header(k,q,info){return `<div class="eyebrow">${k}</div><h2 class="question">${safe(q)}</h2><p class="lead">${safe(info)}</p><div class="steps"><span class="progress-text">${st.page+1} / 6</span><span>選び直しはいつでも可能</span></div><div class="meter"><div style="width:${(st.page+1)/6*100}%"></div></div>`}
function picks(key,items,sel,cols=true){return `<div class="grid ${cols?'':'checks'}" id="${key}">${items.map((o,i)=>`<button type="button" class="pick" data-choice="${i}" aria-pressed="${i===sel}">${safe(typeof o==='string'?o:o[0])}${Array.isArray(o)?`<span class="mini">${safe(o[1])}</span>`:''}</button>`).join('')}</div>`}
function note(){return `<details class="memo" ${st.notes[st.page]?'open':''}><summary>✎ 気付いたことをメモする（任意）</summary><textarea id="memo" maxlength="2000" placeholder="書かなくても進められます。個人を特定できる情報は入力しないでください。">${safe(st.notes[st.page]||'')}</textarea></details>`}
function actions(back,next,nextText='次の問いへ →'){return `<div class="actions">${back===null?'<span></span>':`<button type="button" class="btn" id="back">← 戻る</button>`}<button type="button" class="btn primary" id="next">${nextText}</button></div>`}
function setupActions(back,next){let b=el.querySelector('#back'),n=el.querySelector('#next');if(b)b.onclick=()=>go(back);if(n)n.onclick=()=>go(next)}
function setupPicks(key,field,fn){el.querySelectorAll('#'+key+' [data-choice]').forEach(btn=>btn.addEventListener('click',()=>{const i=Number(btn.dataset.choice);st[field]=i;el.querySelectorAll('#'+key+' [data-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));if(fn)fn(i)}))}
function render(){chip();switch(st.page){case 0:return intro();case 1:return clarify();case 2:return prediction();case 3:return contrast();case 4:return essence();default:return outcome()}}
function intro(){el.innerHTML=header('START / テーマを決める','今、何について考えてみたい？','テーマを選びましょう。はっきりした問題がなくても始められます。')+picks('themes',themes,st.theme)+`<div class="hint">まずは「答え」ではなく、「気になる」という気持ちを大切にしましょう。</div>`+note()+actions(null,1,'探究を始める →');setupPicks('themes','theme');setupActions(null,1)}
function clarify(){const w=words();el.innerHTML=header('STEP 1 / 自分の思いを見つける',`「${quote(w.t,26)}」の中で、今どんな思いが強い？`,'自分の気持ちに近いものを選び、次に実現したい姿を探します。')+picks('focus',['なぜだろう？ と気になる','ちょっと困っている','もっとよくしたい','予想と違って驚いた','まだうまく言えない'],st.focus)+`<div class="line"></div><div class="eyebrow">もう一つの問い</div><h3 class="question">その先に、どんな姿を願っている？</h3>`+picks('goals',goals,st.goal)+note()+actions(0,2,'考えを試してみる →');setupPicks('focus','focus');setupPicks('goals','goal');setupActions(0,2)}
function scenarios(){let t=st.theme;return [
{claim:'新しい方法を使えば、学びは必ずよくなる',a:'新しい方法を試す',b:'今の方法を工夫する',aResult:'新しい発見は増えたが、戸惑う人もいた',bResult:'安心して取り組めたが、選択肢は増えにくかった',lens:'学び手'},
{claim:'意見が一致すれば、よい話合いになる',a:'結論を早く一つにする',b:'違いを残して比較する',aResult:'早く決まったが、言いにくい意見が残った',bResult:'時間はかかったが、見えなかった理由に気付いた',lens:'少数意見の人'},
{claim:'努力する時間が長いほど、成長できる',a:'同じ方法を続ける',b:'方法を変えて試す',aResult:'慣れたことは速くなったが、苦手の理由は残った',bResult:'一度戸惑ったが、別のやり方が見つかった',lens:'うまくいかなかった自分'},
{claim:'便利な仕組みなら、みんな喜ぶ',a:'便利な方法を一つに統一',b:'複数の選択肢を残す',aResult:'手間は減ったが、使いにくい人もいた',bResult:'選ぶ手間は残ったが、対応できる人が増えた',lens:'利用しづらい人'},
{claim:'新しい道具を使えば、仕事は必ずよくなる',a:'全員に新しい方法を勧める',b:'目的から使う場面を選ぶ',aResult:'効率は上がったが、効果を感じない人もいた',bResult:'導入はゆっくりだが、役立つ場面を発見できた',lens:'慎重な同僚'},
{claim:'すぐに答えが出る方が、よい学びになる',a:'答えを先に確認する',b:'まず予想し、理由を比べる',aResult:'正答は早く分かったが、理由を話す人は少なかった',bResult:'時間はかかったが、異なる考えを説明できた',lens:'考え始めたばかりの人'}
][t]}
function prediction(){const sc=scenarios();el.innerHTML=header('STEP 2 / 予想して揺さぶる',`「${sc.claim}」は本当だろうか？`,'下の二つの方法を比べて、どちらがよさそうか予想してください。選ぶと結果が現れます。')+picks('predict',[[`A｜${sc.a}`,'こちらを選ぶとどうなる？'],[`B｜${sc.b}`,'こちらを選ぶとどうなる？']],st.assumption)+`<div id="reveal">${st.assumption!==null?revealHTML():''}</div>`+note()+actions(1,3,'反例も探してみる →');setupPicks('predict','assumption',()=>{el.querySelector('#reveal').innerHTML=revealHTML()});setupActions(1,3)}
function revealHTML(){const sc=scenarios();return `<div class="cards" style="margin-top:14px"><div class="tile"><strong>実験Aの結果</strong><p>${safe(sc.aResult)}</p></div><div class="tile"><strong>実験Bの結果</strong><p>${safe(sc.bResult)}</p></div></div><div class="insight"><b>予想と比べて、どう感じた？</b><div style="margin-top:7px">どちらにも良い点と難しい点がありました。「どんな人に」「どんな条件で」よいかを考えてみましょう。</div></div>`}
function contrast(){const sc=scenarios(),lenses=[`自分と違う立場の人`,sc.lens,'今の方法で成功している人','失敗が怖い人','まだ学び始めた人'];const exceptions=['すべての人に同じ方法が合うとは限らない','目的によって適した方法が変わる','条件や環境が違えば結果も変わる','成功した経験にも大切な理由がある','そもそも比較する基準が違うかもしれない'];el.innerHTML=header('STEP 3 / 反例・条件変更',`「${quote(sc.claim,31)}」を、違う立場から見ると？`,'予想の結果を踏まえ、立場を変えてみます。同じことでも見え方が変わります。')+`<p class="stage-title">① 誰の立場から考える？</p>`+picks('lenses',lenses,st.lens)+`<p class="stage-title" style="margin-top:23px">② どんな例外や条件がありそう？</p>`+picks('except',exceptions,st.exception)+`<div class="insight" id="twist">${twist()}</div>`+note()+actions(2,4,'本質を考える →');setupPicks('lenses','lens',()=>{el.querySelector('#twist').innerHTML=twist()});setupPicks('except','exception',()=>{el.querySelector('#twist').innerHTML=twist()});setupActions(2,4)}
function twist(){if(st.lens===null&&st.exception===null)return '視点と条件を変えると、「必ずこうなる」という考えを見直せるかもしれません。';let lens=['自分と違う立場の人',scenarios().lens,'今の方法で成功している人','失敗が怖い人','まだ学び始めた人'][st.lens??0],x=['誰にも同じ方法がよいとは限らない','目的が違えば選択も違う','条件次第で結果も変わる','今までの成功も尊重する','判断のものさし自体を変える'][st.exception??0];return `<b>問い返し</b><div>もし「${safe(lens)}」の立場で、「${safe(x)}」と考えたら、最初の予想はどう変わるだろう？</div>`}
function essence(){const measures=['目に見える行動が変わる','理由や根拠を説明できる','挑戦や試行錯誤が増える','他の人との関わりが変わる','理解や成果を比較できる','どれもまだ十分でない'];const actionsList=['小さく試して比較する','違う立場の人に話を聞く','実際の様子を観察する','何を確かめるか決める','問い自体をもう一度考える'];el.innerHTML=header('STEP 4 / 本質を見つける',`「${quote(words().g,27)}」が実現したと、どうしたら分かる？`,'「なんとなくよさそう」だけでなく、観察・比較できる変化を考えましょう。')+picks('measure',measures,st.measure)+`<div class="line"></div><div class="eyebrow">試す前に予想してみよう</div><h3 class="question">変化を確かめる最初の一歩は？</h3>`+picks('action',actionsList,st.action)+`<div class="hint"><b>見取りのポイント：</b> 楽しかったことと、深く学べたことは同じとは限りません。何を根拠に考えますか？</div>`+note()+actions(3,5,'自分の問いを見直す →');setupPicks('measure','measure');setupPicks('action','action');setupActions(3,5)}
function finalQuestion(){const w=words();const cond=['人それぞれの違い','目的による違い','条件の違い','これまでの成功経験','判断基準の違い'][st.exception??2];const evidence=['行動の変化','根拠を説明する姿','挑戦や試行錯誤','関わりの変化','理解や成果','観察できる変化'][st.measure??5];return `「${w.t}」について、${cond}も大切にしながら、どうすれば「${w.g}」を実現できるだろう？ それを${evidence}からどう確かめられるだろう？`}
function outcome(){const w=words(),sc=scenarios(),q=st.rewritten||finalQuestion();el.innerHTML=header('FINISH / 変化を振り返る','最初の考えは、どう変わった？','最初の予想と、異なる視点で考えた後の問いを見比べましょう。')+`<div class="compare"><b>出発点</b><p>${safe(w.t)}｜${safe(w.f)}</p></div><div class="arrow" aria-hidden="true">↓</div><div class="compare"><b>最初の予想</b><p>${safe(sc.claim)}</p><div class="micro muted">選んだ方向：${st.assumption===0?'A':st.assumption===1?'B':'未選択'}</div></div><div class="arrow" aria-hidden="true">↓</div><div class="compare"><b>新しい視点</b><p>${safe(['誰もが同じとは限らない','目的によって変わる','条件によって変わる','経験を尊重する','ものさしを見直す'][st.exception??2])}</p></div><div class="arrow" aria-hidden="true">↓</div><div class="compare" style="background:#eff9f5"><b>育った問い（たたき台）</b><p>${safe(q)}</p></div><label for="rewrite" style="display:block;margin-top:22px;font-weight:800;font-size:14px">自分の言葉に直してみよう（任意）</label><textarea id="rewrite" class="edit" maxlength="1000" aria-label="新しく育った問い">${safe(q)}</textarea><div class="hint">答えを決める必要はありません。 「何を確かめたいか」が見えれば、それも大きな発見です。</div><div class="actions"><button class="btn" id="back">← 見直す</button><button class="btn soft" id="copy">まとめをコピー</button><button class="btn primary" id="download">テキスト保存 ↓</button></div><div class="actions"><button class="btn soft" id="repeat">もう一度問いを深める ↻</button><button class="btn" id="reset">最初から</button></div><p class="status" id="status" role="status"></p>`;el.querySelector('#back').onclick=()=>go(4);el.querySelector('#rewrite').oninput=e=>st.rewritten=e.target.value;el.querySelector('#reset').onclick=reset;el.querySelector('#repeat').onclick=()=>{st.branch++;st.focus=null;st.goal=null;st.assumption=null;st.lens=null;st.exception=null;st.measure=null;st.action=null;st.notes={};st.rewritten='';st.page=1;render()};el.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(report());el.querySelector('#status').textContent='コピーしました'}catch(e){el.querySelector('#status').textContent='コピーできない環境です。「テキスト保存」をお使いください。'}};el.querySelector('#download').onclick=()=>{const file=new Blob([report()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download='問いの探究ラボ_振り返り.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};}
function report(){const w=words();return ['問いの探究ラボ｜振り返り','テーマ：'+w.t,'気になること：'+w.f,'実現したい姿：'+w.g,'最初の予想：'+scenarios().claim,'見直した条件：'+(['同じ方法とは限らない','目的による','条件による','成功を尊重','基準の違い'][st.exception??2]),'確かめたい指標：'+(['行動','説明','試行錯誤','協働','成果','検討中'][st.measure??5]),'次に試すこと：'+(['比較する','話を聞く','観察する','基準を決める','問い直す'][st.action??4]),'新しく育った問い：'+(el.querySelector('#rewrite')?.value||st.rewritten||finalQuestion()),...Object.entries(st.notes).filter(([,v])=>v.trim()).map(([n,v])=>`メモ${Number(n)+1}：${v}`)].join('\n')}
render();})();
</script></body></html>
