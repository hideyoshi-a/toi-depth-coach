us:20px;margin:10px 0 16px;overflow:hidden}.progress span{height:100%;display:block;background:#2f9890;transition:width .25s}.toggle{display:inline-flex;align-items:center;gap:7px;border-radius:12px;border:1px solid var(--edge);padding:8px 10px;background:white;font-weight:750;font-size:13px}.toggle input{width:auto;accent-color:var(--teal);margin:0}.badge{background:#e0f2ef;border-radius:10px;padding:5px 9px;color:#155d58;font-size:12px;font-weight:800}.sections{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}.attempt{display:flex;gap:9px;align-items:flex-start;padding:12px;border:1px solid var(--edge);background:#f9fcfc;border-radius:12px;margin-top:9px}.attempt .grow{flex:1;min-width:0}.attempt b{display:block;font-size:14px;overflow-wrap:anywhere}.attempt small{color:var(--muted)}.empty{font-size:13px;color:var(--muted);padding:15px;background:#f6f9f9;border-radius:12px}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.details summary{font-size:13px;font-weight:800;color:var(--teal);cursor:pointer}.status{min-height:20px;font-size:12px;color:var(--teal)}.foot{text-align:center;font-size:12px;color:var(--muted);margin:20px auto;line-height:1.9}.sr-only{position:absolute;clip:rect(0,0,0,0);height:1px;width:1px;overflow:hidden}.example{margin:10px 0;border-radius:12px;padding:12px;background:#f5f9fb;border:1px solid var(--edge);font-size:14px}.selected-q{border:2px solid var(--edge);padding:12px;border-radius:13px;margin:8px 0;background:#fff;text-align:left;width:100%;font-weight:730;line-height:1.65}.selected-q[aria-pressed="true"]{border-color:var(--teal);background:#def4ed}.selected-q[aria-pressed="true"]:before{content:"✓ 選択中　";font-size:12px;color:var(--teal)}.selected-q small{display:block;font-size:12px;color:var(--muted);font-weight:400}.question-big{background:var(--mint);padding:14px;border-radius:13px;font-size:19px;font-weight:850;line-height:1.65;margin:14px 0}.counter{font-size:13px;color:var(--muted)}@media(max-width:600px){.grid,.grid3{grid-template-columns:1fr}.hero{padding:24px 19px}.wrap{padding:12px 11px 40px}.actions .btn{flex:1}.question-big{font-size:17px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.progress span{transition:none}}@media print{.actions,.top,.hero,.pillrow,.toggle,.foot,.btn,.editor-area{display:none!important}.panel{box-shadow:none;break-inside:avoid}.wrap{padding:0}}
.bridge{margin:12px 0;padding:15px;background:#f0faf6;border:2px solid #a7d8ca;border-radius:16px}.bridge h4{margin:0 0 10px;font-size:16px}.bridge-sources{display:grid;gap:9px}.source-q{background:white;border:1px solid #c9e0db;border-radius:12px;padding:12px;font-weight:700;overflow-wrap:anywhere}.source-q small{display:block;color:var(--teal);font-size:12px}.bridge-arrow{text-align:center;color:var(--teal);font-weight:900;padding:10px}.bridge-words{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.bridge-word{background:#fff9e6;border:1px solid #dbc57a;border-radius:12px;padding:12px;min-width:0;overflow-wrap:anywhere}.bridge-word small{display:block;font-size:11px;color:#6c633c}.bridge-word strong{display:block;font-size:15px}.plus{font-weight:900;font-size:24px}.learning-check{display:grid;gap:9px;margin:10px 0}.learning-check button{width:100%;text-align:left}.learning-check button[aria-pressed="true"]{background:#def4ed;border-color:var(--teal)}@media(max-width:600px){.bridge-words{grid-template-columns:1fr}.plus{text-align:center}} 
.thinking-lab{margin:22px 0;padding:18px;background:#f7f8fe;border:1px solid #cbd4ed;border-radius:17px}.thinking-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.thinking-card{text-align:left;border:2px solid #d5ddec;border-radius:13px;padding:11px;background:white;color:var(--txt);min-height:103px;display:flex;flex-direction:column;gap:3px}.thinking-card strong{font-size:15px}.thinking-card small{font-size:12px;color:var(--teal)}.thinking-card span{font-size:12px;color:var(--muted)}.thinking-card[aria-pressed="true"]{border-color:#3d6797;background:#e6efff;box-shadow:inset 0 0 0 1px #3d6797}.thinking-card[aria-pressed="true"] strong:before{content:"✓ ";color:#215e86}.thinking-preview{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);gap:10px;margin-top:15px;align-items:stretch}.thinking-preview>div:not(.thinking-flow){background:white;border:1px solid #cdd8e8;border-radius:12px;padding:12px;min-width:0;overflow-wrap:anywhere}.thinking-preview small{font-size:12px;color:#557188;font-weight:800}.thinking-preview p{font-size:14px;font-weight:750;margin:8px 0}.thinking-flow{font-size:12px;align-self:center;text-align:center;color:#315c85;font-weight:850}.thinking-lab .btn:disabled{opacity:.45}@media(max-width:650px){.thinking-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.thinking-preview{grid-template-columns:1fr}.thinking-flow{padding:4px}}@media(max-width:350px){.thinking-grid{grid-template-columns:1fr}}

<body><div class="wrap"><header class="top"><span class="brand"><i>?</i>問いの発見ラボ <span class="mini">Ver.3.4</span></span><span class="mini">5W1H × UDL × 思考の6段階</span></header>
<section class="hero"><small>QUESTION DISCOVERY LAB</small><h1>「どうして？」から、<br>自分だけの問いを見つけよう。</h1><p>お題をいろいろな角度から見るトレーニング。選ぶだけでもOK。問いを増やし、比べて、思考の6つのレンズから見直し、自分の「調べたい！」を発見します。</p></section>
<div class="pillrow" id="steps" aria-label="学習の進み方"></div><main id="app" aria-live="polite"></main><footer class="foot">名前・学校名・個人を特定できる情報は入力しないでください。書くかどうかは自由です。<br>アプリは端末のブラウザ内だけで動作し、回答を外部へ送信しません。データはページを閉じると消えます。</footer></div>
<script>
'use strict';
(()=>{
const el=document.getElementById('app'),steps=document.getElementById('steps');
const topics=[
 {title:'🎮 ゲームの時間',scene:'ゲームはなぜこんなに夢中になるの？',things:['ゲームをする時間','ゲームのルール','友達との協力','ゲームの楽しさ'],people:['自分','友達','家族'],situations:['放課後','休日','友達と遊ぶとき'],reason:'楽しく上手につきあいたい'},
 {title:'📱 動画・SNS',scene:'つい動画を見続けるのはなぜ？',things:['おすすめ動画','見る時間','コメント','情報の確かさ'],people:['見る人','投稿する人','家族'],situations:['寝る前','休み時間','家での自由時間'],reason:'便利さも注意点も知りたい'},
 {title:'🍛 好きな給食・食べ物',scene:'人気のメニューにはどんな秘密がある？',things:['好きなメニュー','味つけ','食べ残し','新しい献立'],people:['食べる人','調理する人','献立を考える人'],situations:['給食の時間','食材を選ぶとき','家での食事'],reason:'食べ物の楽しさを発見したい'},
 {title:'🤝 友達との関わり',scene:'友達と気持ちよく過ごすには？',things:['話しかけ方','意見の違い','一緒に遊ぶこと','一人の時間'],people:['自分','友達','初めて話す人'],situations:['休み時間','グループ活動','けんかのあと'],reason:'お互いを大切にしたい'},
 {title:'🏫 昼休み・学校生活',scene:'学校の時間をもっと楽しくできる？',things:['休み時間','遊び場','学校のルール','教室の過ごし方'],people:['児童生徒','先生','一人で過ごしたい人'],situations:['教室','校庭','雨の日'],reason:'みんなが過ごしやすくしたい'},
 {title:'⚽ スポーツ・遊び',scene:'上達したり楽しんだりするコツは？',things:['練習方法','チームワーク','遊びのルール','勝ち負け'],people:['初心者','経験者','一緒に遊ぶ人'],situations:['体育の時間','放課後','大会や試合'],reason:'誰もが楽しめる方法を考えたい'},
 {title:'😴 睡眠・朝の過ごし方',scene:'すっきり起きられる日は何が違う？',things:['寝る時間','朝の気分','スマホの使い方','朝ごはん'],people:['自分','家族','同年代の人'],situations:['平日','休日','テストの前'],reason:'毎日元気に過ごしたい'},
 {title:'🐶 動物・ペット',scene:'動物たちは何を考えているのかな？',things:['動物の行動','鳴き声','暮らし方','世話の方法'],people:['飼い主','動物を守る人','動物が苦手な人'],situations:['家','公園','動物園'],reason:'動物の不思議を知りたい'},
 {title:'🌦️ 天気・自然の不思議',scene:'同じ場所でも天気が変わるのはなぜ？',things:['雨や雲','気温','季節の変化','身近な植物'],people:['外で遊ぶ人','農家の人','自分'],situations:['登校中','季節の変わり目','大雨の日'],reason:'身近な自然をもっと知りたい'},
 {title:'🎵 音楽・好きなもの',scene:'「好き！」と感じる理由は人によって違う？',things:['好きな曲','リズム','歌詞','人気の理由'],people:['自分','友達','作る人'],situations:['気分がいいとき','落ち込んだとき','みんなで聴くとき'],reason:'好きの理由を知りたい'},
 {title:'📚 勉強のコツ',scene:'学びやすい方法は人によって違う？',things:['覚え方','タブレット','話し合い','勉強する場所'],people:['自分','友達','先生'],situations:['授業中','家庭学習','テストの前'],reason:'自分に合う学び方を探したい'},
 {title:'🌎 身近な環境・ごみ',scene:'学校や町のごみを減らすには？',things:['ごみ','分別','使い捨て','リサイクル'],people:['住む人','お店の人','児童生徒'],situations:['家','学校','公園'],reason:'身近な場所を大切にしたい'},
 {title:'✨ 自由なお題',scene:'今、自分がいちばん気になること',things:['気になること','使うもの','場所','人との関わり'],people:['自分','友達','関係する人'],situations:['学校','家','地域'],reason:'自分の「なぜ？」を見つけたい'}
];
const lenses=[{id:'who',en:'Who',jp:'だれが・だれに',verb:'だれ',icon:'👥',stem:'だれにとって',follow:'立場が違う人はどうだろう？'}, {id:'what',en:'What',jp:'何を・何が',verb:'なに',icon:'🔎',stem:'何が',follow:'大切な部分は何だろう？'}, {id:'when',en:'When',jp:'いつ',verb:'いつ',icon:'🕒',stem:'いつ',follow:'時間が変わるとどうなる？'}, {id:'where',en:'Where',jp:'どこで',verb:'どこ',icon:'📍',stem:'どこで',follow:'場所が変わるとどうなる？'}, {id:'why',en:'Why',jp:'なぜ',verb:'なぜ',icon:'💭',stem:'なぜ',follow:'その理由を確かめるには？'}, {id:'how',en:'How',jp:'どのように',verb:'どう',icon:'🛠️',stem:'どうすれば',follow:'別の方法は考えられる？'}];
const st={page:0,topic:0,topicCustom:'',help:2,lens:'',focus:0,questions:[],draft:'',memo:'',chosen:-1,selected:[],reflection:'',reflectionEdited:false,commonChoice:0,commonCustom:'',relation:'cause',wordA:'',wordB:'',wordsEdited:false,check:[],reflectionReason:'',thinkingLevel:null,thinkingBefore:''};
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=()=>topics[st.topic],name=()=>st.topic===topics.length-1?(st.topicCustom.trim()||'自分が気になること'):t().title;
const lens=()=>lenses.find(x=>x.id===st.lens)||lenses[0];
function qsample(type,subject){const v=subject||t().things[st.focus]||name();const topic=name();switch(type){case 'who':return `「${v}」は、だれにとって大切なのだろう？`;case 'what':return `「${topic}」で、何が一番の課題なのだろう？`;case 'when':return `「${v}」が気になるのは、いつだろう？`;case 'where':return `「${v}」について、場所が変わると何が違うのだろう？`;case 'why':return `なぜ「${v}」は、今のようになっているのだろう？`;case 'how':return `「${v}」をよりよくするには、どうすればよいのだろう？`;default:return `「${topic}」で気になることは何だろう？`}}
function mk(template,sub){const v=sub||name();switch(template){case 0:return qsample(st.lens,v);case 1:return `もし「${v}」の条件が変わったら、どうなるのだろう？`;case 2:return `「${v}」について、違う立場の人はどう考えるのだろう？`;case 3:return `「${v}」を確かめるには、何を調べればよいのだろう？`;default:return qsample(st.lens,v)}}
function toolbar(){steps.innerHTML=['お題を選ぶ','5W1Hで発見','問いを育てる','振り返る'].map((x,i)=>`<span class="pill ${i===st.page?'on':''}">${i+1}．${x}</span>`).join('')}
function layout(k,h,desc,body){return `<section class="panel"><span class="eyebrow">${k}</span><h2 class="heading">${h}</h2><p class="lead">${desc}</p><div class="progress"><span style="width:${(st.page+1)*25}%"></span></div>${body}</section>`}
function buttons(){return `<div class="actions"><button type="button" class="btn" id="back" ${st.page===0?'disabled':''}>← 戻る</button><span class="push"></span><button type="button" class="btn main" id="next">${st.page===3?'最初から':'次へ →'}</button></div>`}
function choiceItems(items,selected,attr){return `<div class="grid">${items.map((x,i)=>`<button class="choice" type="button" ${attr}="${i}" aria-pressed="${i===selected}">${escapeHtml(typeof x==='string'?x:x.title)}${x.scene?`<small>${escapeHtml(x.scene)}</small>`:''}</button>`).join('')}</div>`}
function helpPanel(){if(st.help===0)return '';let l=st.lens?lens():lenses[0];return `<div class="help"><strong>💡 ${st.help===2?'いっしょに考えるヒント':'ヒント'}</strong><div>${st.help===2?`「${escapeHtml(l.jp)}」という言葉で始めてみよう。<br>`:''}${escapeHtml(l.follow)}</div>${st.help===2?`<div class="example"><b>問いの例：</b> ${escapeHtml(qsample(l.id))}</div>`:''}</div>`}
function nav(){const b=el.querySelector('#back'),n=el.querySelector('#next');if(b)b.addEventListener('click',()=>go(st.page-1));if(n)n.addEventListener('click',()=>{if(st.page===3){Object.assign(st,{page:0,lens:'',questions:[],draft:'',chosen:-1,selected:[],reflection:'',reflectionEdited:false,commonChoice:0,commonCustom:'',relation:'cause',wordA:'',wordB:'',wordsEdited:false,check:[],reflectionReason:'',thinkingLevel:null,thinkingBefore:''});render()}else go(st.page+1)})}
function go(n){st.page=Math.max(0,Math.min(3,n));render();el.scrollIntoView({block:'start',behavior:'smooth'})}
function intro(){el.innerHTML=layout('STEP 1 / 4','今日は何について考える？','学校・家・遊びなど、身近な「気になる！」から選ぼう。どのお題にも正解は一つではありません。',`${choiceItems(topics,st.topic,'data-topic')}<label for="custom">自由なお題（任意）</label><input id="custom" placeholder="例：推しのキャラクター、通学路の不思議、好きな遊び" maxlength="100" value="${escapeHtml(st.topicCustom)}"><div class="tip">✍️ 書くのが苦手なら、用意されたお題をタップするだけでOK。</div>${buttons()}`);el.querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',()=>{st.topic=+b.dataset.topic;st.focus=0;render()}));el.querySelector('#custom').addEventListener('input',e=>{st.topicCustom=e.target.value;if(e.target.value.trim())st.topic=topics.length-1;el.querySelectorAll('[data-topic]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.topic===st.topic)))});nav()}

el.querySelectorAll('[data-lens]').forEach(b=>b.addEventListener('click',()=>{st.lens=b.dataset.lens;render()}));const check=el.querySelector('#scaffold');check.addEventListener('change',e=>{st.help=e.target.checked?1:0;render()});el.querySelector('#strongHelp').addEventListener('click',()=>{st.help=st.help===2?1:2;render()});const add=el.querySelector('#addSample');if(add)add.addEventListener('click',()=>{addQ(qsample(st.lens),st.lens)});let own=el.querySelector('#ownQ');own.addEventListener('input',()=>st.draft=own.value);el.querySelector('#addOwn').addEventListener('click',()=>{const val=own.value.trim();if(!val){el.querySelector('#added').textContent='自分の問いを書いてから追加してください。';return}addQ(val,st.lens||'free');st.draft=''});bindDelete();nav()}
function addQ(text,type){if(st.questions.some(x=>x.text===text)){const msg=el.querySelector('#added');if(msg)msg.textContent='この問いはすでにストックされています。';return}st.questions.push({text,type});render();const msg=el.querySelector('#added');if(msg)msg.textContent='問いを1つストックしました！'}
function questionsList(selectable){if(!st.questions.length)return `<div class="empty" style="margin-top:14px">まだ問いがありません。5W1Hのカードから問いを集めてみよう。</div>`;return `<div style="margin-top:17px"><strong>📚 問いのストック（${st.questions.length}）</strong>${st.questions.map((x,i)=>`<div class="attempt"><div class="grow"><small>${escapeHtml(lenses.find(y=>y.id===x.type)?.en||'自由な問い')}</small><b>${escapeHtml(x.text)}</b></div>${selectable?`<button class="btn ${st.chosen===i?'soft':''}" data-select="${i}" type="button">${st.chosen===i?'✓ 選択中':'選ぶ'}</button>`:`<button class="btn" data-delete="${i}" type="button" aria-label="問いを削除">削除</button>`}</div>`).join('')}</div>`}
function bindDelete(){el.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.delete;st.questions.splice(i,1);if(st.chosen===i)st.chosen=-1;else if(st.chosen>i)st.chosen--;st.selected=st.selected.filter(n=>n!==i).map(n=>n>i?n-1:n);st.reflectionEdited=false;render()}))}
function develop(){const has=st.questions.length>0;if(st.chosen>=st.questions.length)st.chosen=-1;el.innerHTML=layout('STEP 3 / 4','問いを育ててみよう','気になった問いを選び、別の角度から見直すと、より調べたくなる問いに変わるかもしれません。',`${questionsList(true)}<div class="tip">${has?'好きな問いを一つ選ぼう。選ぶのが難しければ、いちばん「なぜ？」と思うものから。':'前の画面で問いを集めよう。まだ難しければ、下の「例の問いを使う」で進められます。'}</div>${!has?`<button class="btn soft" id="exampleQ">＋ 例の問いを使う</button>`:''}<div class="line" style="border-top:1px solid var(--edge);margin:19px 0"></div><h3 class="heading" style="font-size:19px">見方を変えるスイッチ</h3><div class="grid">${['もし条件が変わったら？','違う立場の人なら？','どうすれば確かめられる？'].map((x,i)=>`<button class="choice" type="button" data-grow="${i}" aria-pressed="false">${x}</button>`).join('')}</div><div id="grown" aria-live="polite"></div><details class="details" style="margin-top:15px"><summary>メモする（任意）</summary><textarea id="memo" maxlength="1000" placeholder="考えが変わったところなどを残せます">${escapeHtml(st.memo)}</textarea></details>${buttons()}`);el.querySelectorAll('[data-select]').forEach(b=>b.addEventListener('click',()=>{st.chosen=+b.dataset.select;render()}));const e=el.querySelector('#exampleQ');if(e)e.addEventListener('click',()=>{st.questions.push({text:qsample('why'),type:'why'});st.chosen=0;render()});el.querySelectorAll('[data-grow]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.grow;const source=st.chosen>=0?st.questions[st.chosen].text:qsample('why');const refined= ['もし時間や場所が変わったら、'+source,'違う立場の人はどう考えるのだろう？ '+source,'この問いの答えを確かめるには、何を比べればよいのだろう？'][i];el.querySelectorAll('[data-grow]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));el.querySelector('#grown').innerHTML=`<div class="help"><b>新しい見方から生まれる問い</b><p>${escapeHtml(refined)}</p><button class="btn soft" id="addGrown">＋ ストックに追加</button></div>`;el.querySelector('#addGrown').onclick=()=>{addQ(refined,'free')};}));const memo=el.querySelector('#memo');if(memo)memo.addEventListener('input',()=>st.memo=memo.value);nav()}
function selectedQuestions(){return st.selected.filter(i=>i>=0&&i<st.questions.length).map(i=>st.questions[i])}
function keyWord(q){
 if(!q)return name();
 const m=q.text.match(/「([^」]{2,55})」/);
 if(m)return m[1];
 const linked=t().things.find(word=>q.text.includes(word));if(linked)return linked;
 return q.text.replace(/[？?。]/g,'').slice(0,40)||name();
}
function questionWords(){const qs=selectedQuestions();return [keyWord(qs[0]),keyWord(qs[1]||qs[0])];}
function activeWords(){const auto=questionWords();return st.wordsEdited?[st.wordA.trim()||auto[0],st.wordB.trim()||auto[1]]:auto;}
function commonTopics(){return [...new Set([...selectedQuestions().map(keyWord),...t().things,name()])].slice(0,4);}
function commonName(){return st.commonCustom.trim()||commonTopics()[st.commonChoice]||name();}
const relations=[
 {id:'cause',label:'理由と工夫',hint:'なぜ起こる？ どうすればよい？'},
 {id:'compare',label:'違いと理由',hint:'人や時間・場所で、何が違う？'},
 {id:'effect',label:'変化と影響',hint:'条件を変えると、どんな変化？'},
 {id:'connect',label:'つながりを探る',hint:'2つのことはどう関係する？'}
];
function combineQuestions(){
 const qs=selectedQuestions();if(!qs.length)return '';
 if(qs.length===1)return qs[0].text;
 const [a,b]=activeWords(),c=commonName(),pair=a===b?`「${a}」`:`「${a}」と「${b}」`;
 switch(st.relation){
 case 'compare':return `${pair}は人や時間・場所によってどう違い、なぜその違いが生まれるのだろう？`;
 case 'effect':return `${pair}の条件を変えると「${c}」にどのような変化が起こるのだろう？`;
 case 'connect':return `${pair}にはどんな関係があり、「${c}」を考えると何が分かるのだろう？`;
 default:return `${pair}にはどんな理由があり、「${c}」をよりよくするにはどうすればよいのだろう？`;
 }
}

// 認知領域の六段階は順位付け・採点ではなく、問いを別の角度から見直す「思考のレンズ」として扱う。
const thinkingLenses=[
 {name:'記憶',action:'思い出す',prompt:'いつ・どこで・何があった？',hint:'まず確かめたい事実を挙げよう。'},
 {name:'理解',action:'説明する',prompt:'なぜ？ どんな意味？',hint:'理由や仕組みを自分の言葉で説明してみよう。'},
 {name:'応用',action:'利用する',prompt:'知っていることをどう使う？',hint:'自分の生活や別の場面で試す方法を考えよう。'},
 {name:'分析',action:'分解・比較する',prompt:'共通点・違い・関係は？',hint:'人・時間・条件などで比べてみよう。'},
 {name:'評価',action:'判断する',prompt:'何を基準に判断する？',hint:'根拠や大切にしたい条件を考えよう。'},
 {name:'創造',action:'新しく生み出す',prompt:'別の方法・仕組みを考えられる？',hint:'新しいアイデアを考え、そのよさを確かめよう。'}
];
function thinkingQuestion(index){
 const [a,b]=activeWords(),c=commonName(),pair=a===b?`「${a}」`:`「${a}」と「${b}」`;
 switch(index){
  case 0:return `${pair}について、いつ・どこで・どんなことが起きているのだろう？`;
  case 1:return `${pair}はなぜそうなっていて、どのような仕組みで「${c}」と関わるのだろう？`;
  case 2:return `${pair}から分かったことを、「${c}」をよりよくするためにどう生かせるだろう？`;
  case 3:return `${pair}にはどんな共通点と違いがあり、それは何と関係しているのだろう？`;
  case 4:return `${pair}について、どんな基準と根拠で「${c}」のよさを判断できるだろう？`;
  case 5:return `${pair}から学んだことを生かし、「${c}」のためにどんな新しい方法を考え、試せるだろう？`;
  default:return combineQuestions();
 }
}

function bridgeDiagram(){

function result(){
 st.selected=st.selected.filter((n,i,a)=>n>=0&&n<st.questions.length&&a.indexOf(n)===i);

 const proposed=combineQuestions();if(!st.reflectionEdited)st.reflection=proposed;

 el.innerHTML=layout('STEP 4 / 4','2つの問いから、新しい探究の問いへ','「選ぶ → 見比べる → つなぐ → 確かめる」の順で考えよう。書くことは任意です。',
 `<span class="badge">今回のお題：${escapeHtml(name())}</span><p class="counter">集めた問い：${st.questions.length}個 ／ 選択中：<b id="selectedCount">${st.selected.length}</b>個</p><h3 class="heading" style="font-size:19px">① 関係がありそうな問いを2つ以上選ぼう</h3><div id="finalOptions">${options}</div><div id="deepArea">${detail}</div><h3 class="heading" style="font-size:19px;margin-top:24px">⑤ つなぐと、どんな問いが生まれる？</h3><div class="help"><b>選んだ問いの言葉を使った組み合わせ例</b><div class="question-big" id="combinedPreview">${escapeHtml(proposed||'まず問いを選ぼう')}</div><p class="notice">この文は「問いの型」の例です。問いをよく見て、意味が通るか確かめよう。</p></div>${thinkingMarkup()}<label for="finalQ">⑦ 自分たちの最終的な問い（自由に直せます）</label><textarea id="finalQ" maxlength="500">${escapeHtml(st.reflection)}</textarea><div class="actions"><button class="btn soft" type="button" id="useExample">上の例を入力欄に使う</button></div><h3 class="heading" style="font-size:19px;margin-top:25px">⑧ この問いは、調べられるかな？</h3><p class="lead">自分の問いをよりよくするチェック。まだ当てはまらなくても、何度でも直せます。</p><div class="learning-check">${[['元の問いの2つ以上の視点が入っている','視点がつながっている？'],['人・時間・場所・条件などを比べられる','調べる方法が考えられる？'],['自分が本当に知りたいことになっている','自分の興味とつながっている？']].map((x,i)=>`<button type="button" class="choice" data-check="${i}" aria-pressed="${st.check.includes(i)}">${x[1]}<small>${x[0]}</small></button>`).join('')}</div><div class="tip" id="checkAdvice">${st.check.length===3?'🌱 3つの視点で確かめられました。問いをさらに具体的にしてみよう。':'💡 チェックはテストではありません。気になるところから問いを直してみよう。'}</div><details class="details" style="margin-top:15px" ${st.reflectionReason?'open':''}><summary>✎ 最初の問いから何が変わった？（任意）</summary><textarea id="reason" maxlength="500" placeholder="例：理由だけでなく、友達との違いも考えたくなった">${escapeHtml(st.reflectionReason)}</textarea></details><div class="actions"><button class="btn" id="copy">結果をコピー</button><button class="btn" id="save">テキストを保存</button><button class="btn soft" id="backMore">← もっと問いを出す</button></div><div id="resultStatus" class="status" role="status"></div>${buttons()}`);
 const tx=el.querySelector('#finalQ');
 function update(){const text=combineQuestions();el.querySelector('#combinedPreview').textContent=text||'まず問いを選ぼう';const words=activeWords();const aa=el.querySelector('#viewA'),bb=el.querySelector('#viewB');if(aa)aa.textContent=words[0];if(bb)bb.textContent=words[1];const base=el.querySelector('#thinkingOriginal'),idea=el.querySelector('#thinkingProposed');if(base)base.textContent=text;if(idea&&st.thinkingLevel!==null)idea.textContent=thinkingQuestion(st.thinkingLevel);if(!st.reflectionEdited){st.reflection=text;tx.value=text}}

 el.querySelectorAll('[data-final-select]').forEach(btn=>btn.onclick=()=>{const i=+btn.dataset.finalSelect;st.selected=st.selected.includes(i)?st.selected.filter(x=>x!==i):[...st.selected,i];btn.setAttribute('aria-pressed',String(st.selected.includes(i)));el.querySelector('#selectedCount').textContent=st.selected.length;st.wordsEdited=false;st.wordA='';st.wordB='';st.commonChoice=0;st.commonCustom='';el.querySelector('#deepArea').innerHTML=st.selected.length>=2?deepMarkup():'<div class="help">問いを2つ以上選ぶと、比較する図と問いをつなぐヒントが現れます。</div>';bindDeep();update()});
 bindDeep();
 const refreshThinking=()=>{

  const idea=el.querySelector('#thinkingProposed'),tip=el.querySelector('#thinkingHint'),apply=el.querySelector('#applyThinking');

 el.querySelector('#clearThinking').onclick=()=>{st.thinkingLevel=null;refreshThinking()};
 el.querySelector('#applyThinking').onclick=()=>{if(st.thinkingLevel===null)return;st.thinkingBefore=tx.value||combineQuestions();st.reflection=thinkingQuestion(st.thinkingLevel);st.reflectionEdited=true;tx.value=st.reflection;tx.focus()};
 el.querySelectorAll('[data-check]').forEach(btn=>btn.onclick=()=>{const i=+btn.dataset.check;st.check=st.check.includes(i)?st.check.filter(x=>x!==i):[...st.check,i];btn.setAttribute('aria-pressed',String(st.check.includes(i)));el.querySelector('#checkAdvice').textContent=st.check.length===3?'🌱 3つの視点で確かめられました。問いをさらに具体的にしてみよう。':'💡 チェックはテストではありません。気になるところから問いを直してみよう。'});
 const reason=el.querySelector('#reason');if(reason)reason.addEventListener('input',()=>st.reflectionReason=reason.value);
 el.querySelector('#useExample').onclick=()=>{st.reflection=combineQuestions();st.reflectionEdited=false;tx.value=st.reflection;tx.focus()};
 el.querySelector('#copy').onclick=async()=>{const txt=exportText(tx.value);try{await navigator.clipboard.writeText(txt);el.querySelector('#resultStatus').textContent='コピーしました。'}catch{tx.focus();tx.select();el.querySelector('#resultStatus').textContent='コピーできませんでした。上の欄を選択してコピーしてください。'}};
 el.querySelector('#save').onclick=()=>{const blob=new Blob([exportText(tx.value)],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='toi-discovery-v3-4.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
 el.querySelector('#backMore').onclick=()=>go(1);nav();
}

function exportText(text){return ['問いの発見ラボ Ver.3.4','お題：'+name(),'','集めた問い：',...st.questions.map((x,i)=>`${i+1}. ${x.text}`),'','最終候補に選んだ問い：',...selectedQuestions().map((x,i)=>`${i+1}. ${x.text}`),'','つないだ言葉：'+activeWords().join(' ＋ '),'共通する話題：'+commonName(),'関係の見方：'+(relations.find(r=>r.id===st.relation)?.label||''),'思考のレンズ：'+(st.thinkingLevel===null?'選択なし':thinkingLenses[st.thinkingLevel].name),'レンズによる問い直し例：'+(st.thinkingLevel===null?'':thinkingQuestion(st.thinkingLevel)),'組み合わせ例：'+combineQuestions(),'','最終的な問い：'+(text.trim()||combineQuestions()),'見直しチェック：'+st.check.length+'/3',st.reflectionReason?'問いの変化：'+st.reflectionReason:'',st.memo?'メモ：'+st.memo:''].join('\n')}
function render(){toolbar();if(st.page===0)intro();else if(st.page===1)lensesPage();else if(st.page===2)develop();else result()}
render();
})();
</script>
</body></html>
