<style>
:root{--navy:#15384a;--teal:#136e75;--mint:#eaf6f2;--bg:#f5f8fa;--edge:#d5e2e5;--txt:#233c48;--muted:#536f7a;--gold:#fff4d6;--white:#fff;--focus:#b35c00}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"BIZ UDPGothic","Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif;color:var(--txt);background:var(--bg);line-height:1.7}button,textarea,input,select{font:inherit}button{touch-action:manipulation;cursor:pointer}button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.wrap{width:min(960px,100%);padding:18px 15px 65px;margin:auto}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:13px}.brand{font-weight:900;font-size:16px}.brand i{font-style:normal;display:inline-grid;place-items:center;background:var(--navy);color:white;width:36px;height:36px;border-radius:10px;margin-right:8px}.mini{font-size:12px;color:var(--muted)}.hero{border-radius:22px;padding:25px;background:linear-gradient(125deg,#15394b,#24717a);color:white;position:relative;overflow:hidden}.hero:after{content:'？';font-size:175px;position:absolute;right:13px;top:-56px;opacity:.09;font-weight:900;pointer-events:none}.hero small{letter-spacing:.17em;font-size:11px;color:#bce7de;font-weight:900}.hero h1{font-size:clamp(24px,3.3vw,34px);line-height:1.5;margin:8px 0}.hero p{font-size:14px;max-width:630px;margin:0;color:#e3f4f3}.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.pill{font-size:12px;border-radius:40px;background:white;border:1px solid var(--edge);padding:7px 12px;color:var(--muted)}.pill.on{background:var(--navy);color:white}.panel{border-radius:19px;background:white;border:1px solid var(--edge);box-shadow:0 6px 26px #134d6110;padding:clamp(16px,3vw,27px);margin:14px 0}.eyebrow{font-size:12px;color:var(--teal);font-weight:900;letter-spacing:.04em}.heading{font-size:clamp(20px,3vw,25px);line-height:1.55;margin:6px 0 9px}.lead{font-size:14px;color:var(--muted);margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.choice{display:block;border:2px solid var(--edge);border-radius:14px;background:white;min-height:58px;text-align:left;padding:12px 14px;font-weight:750;color:var(--txt)}.choice:hover{border-color:#71b5b1}.choice[aria-pressed="true"]{border-color:var(--teal);background:#def4ed;box-shadow:inset 0 0 0 1px var(--teal)}.choice[aria-pressed="true"]:before{content:'✓ ';color:var(--teal)}.choice small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}.kind{font-size:12px;font-weight:800;display:inline-block;border-radius:7px;background:var(--mint);color:#165f64;padding:4px 7px;margin-right:7px}.tip{border-radius:11px;background:var(--gold);padding:13px 15px;font-size:13px;margin:14px 0}.help{background:#edf6f9;border-left:4px solid #439eae;border-radius:9px;padding:13px;margin:14px 0;font-size:14px}.question-card{border:1px solid var(--edge);border-radius:14px;padding:12px 13px;margin:9px 0;background:#f9fcfc}.question-card p{font-weight:760;margin:7px 0;font-size:15px}.btn{min-height:45px;padding:10px 16px;background:white;color:var(--navy);border-radius:11px;border:1px solid var(--edge);font-size:14px;font-weight:750}.btn.main{background:var(--navy);border-color:var(--navy);color:white}.btn.soft{background:var(--mint);border-color:#b7d8d2}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:17px}.actions .push{margin-left:auto}.muted{color:var(--muted)}label{display:block;font-size:13px;font-weight:800;margin:12px 0 5px}textarea,input,select{width:100%;border:1px solid #b5cbd1;background:#fff;border-radius:11px;padding:11px;color:var(--txt)}textarea{min-height:78px;resize:vertical}.notice{font-size:12px;color:var(--muted);margin:12px 0}.progress{height:7px;background:#e3ebee;border-radius:20px;margin:10px 0 16px;overflow:hidden}.progress span{height:100%;display:block;background:#2f9890;transition:width .25s}.toggle{display:inline-flex;align-items:center;gap:7px;border-radius:12px;border:1px solid var(--edge);padding:8px 10px;background:white;font-weight:750;font-size:13px}.toggle input{width:auto;accent-color:var(--teal);margin:0}.badge{background:#e0f2ef;border-radius:10px;padding:5px 9px;color:#155d58;font-size:12px;font-weight:800}.sections{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}.attempt{display:flex;gap:9px;align-items:flex-start;padding:12px;border:1px solid var(--edge);background:#f9fcfc;border-radius:12px;margin-top:9px}.attempt .grow{flex:1;min-width:0}.attempt b{display:block;font-size:14px;overflow-wrap:anywhere}.attempt small{color:var(--muted)}.empty{font-size:13px;color:var(--muted);padding:15px;background:#f6f9f9;border-radius:12px}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.details summary{font-size:13px;font-weight:800;color:var(--teal);cursor:pointer}.status{min-height:20px;font-size:12px;color:var(--teal)}.foot{text-align:center;font-size:12px;color:var(--muted);margin:20px auto;line-height:1.9}.sr-only{position:absolute;clip:rect(0,0,0,0);height:1px;width:1px;overflow:hidden}.example{margin:10px 0;border-radius:12px;padding:12px;background:#f5f9fb;border:1px solid var(--edge);font-size:14px}.selected-q{border:2px solid var(--edge);padding:12px;border-radius:13px;margin:8px 0;background:#fff;text-align:left;width:100%;font-weight:730;line-height:1.65}.selected-q[aria-pressed="true"]{border-color:var(--teal);background:#def4ed}.selected-q[aria-pressed="true"]:before{content:"✓ 選択中　";font-size:12px;color:var(--teal)}.selected-q small{display:block;font-size:12px;color:var(--muted);font-weight:400}.question-big{background:var(--mint);padding:14px;border-radius:13px;font-size:19px;font-weight:850;line-height:1.65;margin:14px 0}.counter{font-size:13px;color:var(--muted)}@media(max-width:600px){.grid,.grid3{grid-template-columns:1fr}.hero{padding:24px 19px}.wrap{padding:12px 11px 40px}.actions .btn{flex:1}.question-big{font-size:17px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.progress span{transition:none}}@media print{.actions,.top,.hero,.pillrow,.toggle,.foot,.btn,.editor-area{display:none!important}.panel{box-shadow:none;break-inside:avoid}.wrap{padding:0}}

<body><div class="wrap"><header class="top"><span class="brand"><i>?</i>問いの発見ラボ <span class="mini">Ver.3.1</span></span><span class="mini">5W1H × UDL</span></header>
<section class="hero"><small>QUESTION DISCOVERY LAB</small><h1>「どうして？」から、<br>自分だけの問いを見つけよう。</h1><p>お題をいろいろな角度から見るトレーニング。選ぶだけでもOK。問いを増やし、比べて、自分の「調べたい！」を発見します。</p></section>
<div class="pillrow" id="steps" aria-label="学習の進み方"></div><main id="app" aria-live="polite"></main><footer class="foot">名前・学校名・個人を特定できる情報は入力しないでください。書くかどうかは自由です。<br>アプリは端末のブラウザ内だけで動作し、回答を外部へ送信しません。データはページを閉じると消えます。</footer></div>
<script>
'use strict';
(()=>{
const el=document.getElementById('app'),steps=document.getElementById('steps');
const topics=[
 {title:'🎮 ゲームの時間',scene:'ゲームはなぜこんなに夢中になるの？',things:['ゲームをする時間','ゲームのルール','友達との協力','ゲームの楽しさ'],people:['自分','友達','家族'],situations:['放課後','休日','友達と遊ぶとき'],reason:'楽しく上手につきあいたい'},
 {title:'📱 動画・SNS',scene:'つい動画を見続けるのはなぜ？',things:['おすすめ動画','見る時間','コメント','情報の確かさ'],people:['見る人','投稿する人','家族'],situations:['寝る前','休み時間','家での自由時間'],reason:'便利さも注意点も知りたい'},
 {title:'🍛 好きな給食・食べ物',scene:'人気のメニューにはどんな秘密がある？',things:['好きなメニュー','味つけ','食べ残し','新しい献立'],people:['食べる人','調理する人','献立を考える人'],situations:['給食の時間','食材を選ぶとき','家での食事'],reason:'食べ物の楽しさを発見したい'},
 {title:'🤝 友達との関わり',scene:'友達と気持ちよく過ごすには？',things:['話しかけ方','意見の違い','一緒に遊ぶこと','一人の時間'],people:['自分','友達','初めて話す人'],situations:['休み時間','グループ活動','けんかのあと'],reason:'お互いを大切にしたい'},
 {title:'🏫 昼休み・学校生活',scene:'学校の時間をもっと楽しくできる？',things:['休み時間','遊び場','学校のルール','教室の過ごし方'],people:['児童生徒','先生','一人で過ごしたい人'],situations:['教室','校庭','雨の日'],reason:'みんなが過ごしやすくしたい'},
 {title:'⚽ スポーツ・遊び',scene:'上達したり楽しんだりするコツは？',things:['練習方法','チームワーク','遊びのルール','勝ち負け'],people:['初心者','経験者','一緒に遊ぶ人'],situations:['体育の時間','放課後','大会や試合'],reason:'誰もが楽しめる方法を考えたい'},
 {title:'😴 睡眠・朝の過ごし方',scene:'すっきり起きられる日は何が違う？',things:['寝る時間','朝の気分','スマホの使い方','朝ごはん'],people:['自分','家族','同年代の人'],situations:['平日','休日','テストの前'],reason:'毎日元気に過ごしたい'},
 {title:'🐶 動物・ペット',scene:'動物たちは何を考えているのかな？',things:['動物の行動','鳴き声','暮らし方','世話の方法'],people:['飼い主','動物を守る人','動物が苦手な人'],situations:['家','公園','動物園'],reason:'動物の不思議を知りたい'},
 {title:'🌦️ 天気・自然の不思議',scene:'同じ場所でも天気が変わるのはなぜ？',things:['雨や雲','気温','季節の変化','身近な植物'],people:['外で遊ぶ人','農家の人','自分'],situations:['登校中','季節の変わり目','大雨の日'],reason:'身近な自然をもっと知りたい'},
 {title:'🎵 音楽・好きなもの',scene:'「好き！」と感じる理由は人によって違う？',things:['好きな曲','リズム','歌詞','人気の理由'],people:['自分','友達','作る人'],situations:['気分がいいとき','落ち込んだとき','みんなで聴くとき'],reason:'好きの理由を知りたい'},
 {title:'📚 勉強のコツ',scene:'学びやすい方法は人によって違う？',things:['覚え方','タブレット','話し合い','勉強する場所'],people:['自分','友達','先生'],situations:['授業中','家庭学習','テストの前'],reason:'自分に合う学び方を探したい'},
 {title:'🌎 身近な環境・ごみ',scene:'学校や町のごみを減らすには？',things:['ごみ','分別','使い捨て','リサイクル'],people:['住む人','お店の人','児童生徒'],situations:['家','学校','公園'],reason:'身近な場所を大切にしたい'},
 {title:'✨ 自由なお題',scene:'今、自分がいちばん気になること',things:['気になること','使うもの','場所','人との関わり'],people:['自分','友達','関係する人'],situations:['学校','家','地域'],reason:'自分の「なぜ？」を見つけたい'}
];
const lenses=[{id:'who',en:'Who',jp:'だれが・だれに',verb:'だれ',icon:'👥',stem:'だれにとって',follow:'立場が違う人はどうだろう？'}, {id:'what',en:'What',jp:'何を・何が',verb:'なに',icon:'🔎',stem:'何が',follow:'大切な部分は何だろう？'}, {id:'when',en:'When',jp:'いつ',verb:'いつ',icon:'🕒',stem:'いつ',follow:'時間が変わるとどうなる？'}, {id:'where',en:'Where',jp:'どこで',verb:'どこ',icon:'📍',stem:'どこで',follow:'場所が変わるとどうなる？'}, {id:'why',en:'Why',jp:'なぜ',verb:'なぜ',icon:'💭',stem:'なぜ',follow:'その理由を確かめるには？'}, {id:'how',en:'How',jp:'どのように',verb:'どう',icon:'🛠️',stem:'どうすれば',follow:'別の方法は考えられる？'}];
const st={page:0,topic:0,topicCustom:'',help:2,lens:'',focus:0,questions:[],draft:'',memo:'',chosen:-1,selected:[],reflection:'',reflectionEdited:false};
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=()=>topics[st.topic],name=()=>st.topic===topics.length-1?(st.topicCustom.trim()||'自分が気になること'):t().title;
const lens=()=>lenses.find(x=>x.id===st.lens)||lenses[0];
function qsample(type,subject){const v=subject||t().things[st.focus]||name();const topic=name();switch(type){case 'who':return `「${v}」は、だれにとって大切なのだろう？`;case 'what':return `「${topic}」で、何が一番の課題なのだろう？`;case 'when':return `「${v}」が気になるのは、いつだろう？`;case 'where':return `「${v}」について、場所が変わると何が違うのだろう？`;case 'why':return `なぜ「${v}」は、今のようになっているのだろう？`;case 'how':return `「${v}」をよりよくするには、どうすればよいのだろう？`;default:return `「${topic}」で気になることは何だろう？`}}
function mk(template,sub){const v=sub||name();switch(template){case 0:return qsample(st.lens,v);case 1:return `もし「${v}」の条件が変わったら、どうなるのだろう？`;case 2:return `「${v}」について、違う立場の人はどう考えるのだろう？`;case 3:return `「${v}」を確かめるには、何を調べればよいのだろう？`;default:return qsample(st.lens,v)}}
function toolbar(){steps.innerHTML=['お題を選ぶ','5W1Hで発見','問いを育てる','振り返る'].map((x,i)=>`<span class="pill ${i===st.page?'on':''}">${i+1}．${x}</span>`).join('')}
function layout(k,h,desc,body){return `<section class="panel"><span class="eyebrow">${k}</span><h2 class="heading">${h}</h2><p class="lead">${desc}</p><div class="progress"><span style="width:${(st.page+1)*25}%"></span></div>${body}</section>`}
function buttons(){return `<div class="actions"><button type="button" class="btn" id="back" ${st.page===0?'disabled':''}>← 戻る</button><span class="push"></span><button type="button" class="btn main" id="next">${st.page===3?'最初から':'次へ →'}</button></div>`}
function choiceItems(items,selected,attr){return `<div class="grid">${items.map((x,i)=>`<button class="choice" type="button" ${attr}="${i}" aria-pressed="${i===selected}">${escapeHtml(typeof x==='string'?x:x.title)}${x.scene?`<small>${escapeHtml(x.scene)}</small>`:''}</button>`).join('')}</div>`}
function helpPanel(){if(st.help===0)return '';let l=st.lens?lens():lenses[0];return `<div class="help"><strong>💡 ${st.help===2?'いっしょに考えるヒント':'ヒント'}</strong><div>${st.help===2?`「${escapeHtml(l.jp)}」という言葉で始めてみよう。<br>`:''}${escapeHtml(l.follow)}</div>${st.help===2?`<div class="example"><b>問いの例：</b> ${escapeHtml(qsample(l.id))}</div>`:''}</div>`}
function nav(){const b=el.querySelector('#back'),n=el.querySelector('#next');if(b)b.addEventListener('click',()=>go(st.page-1));if(n)n.addEventListener('click',()=>{if(st.page===3){Object.assign(st,{page:0,lens:'',questions:[],draft:'',chosen:-1,selected:[],reflection:'',reflectionEdited:false});render()}else go(st.page+1)})}
function go(n){st.page=Math.max(0,Math.min(3,n));render();el.scrollIntoView({block:'start',behavior:'smooth'})}
function intro(){el.innerHTML=layout('STEP 1 / 4','今日は何について考える？','学校・家・遊びなど、身近な「気になる！」から選ぼう。どのお題にも正解は一つではありません。',`${choiceItems(topics,st.topic,'data-topic')}<label for="custom">自由なお題（任意）</label><input id="custom" placeholder="例：推しのキャラクター、通学路の不思議、好きな遊び" maxlength="100" value="${escapeHtml(st.topicCustom)}"><div class="tip">✍️ 書くのが苦手なら、用意されたお題をタップするだけでOK。</div>${buttons()}`);el.querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',()=>{st.topic=+b.dataset.topic;st.focus=0;render()}));el.querySelector('#custom').addEventListener('input',e=>{st.topicCustom=e.target.value;if(e.target.value.trim())st.topic=topics.length-1;el.querySelectorAll('[data-topic]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.topic===st.topic)))});nav()}
function lensesPage(){const cards=lenses.map(x=>`<button class="choice" type="button" data-lens="${x.id}" aria-pressed="${st.lens===x.id}"><span class="kind">${x.en}</span>${x.icon} ${x.jp}<small>${x.follow}</small></button>`).join('');el.innerHTML=layout('STEP 2 / 4','5W1Hで問いを発見しよう',`お題：「${escapeHtml(name())}」。6つの見方を自由に試し、気になる問いをストックしよう。`, `<div class="sections"><span class="counter">集めた問い：<b>${st.questions.length}</b> 個</span><span class="badge">順番は自由</span></div><div class="grid3" style="margin-top:13px">${cards}</div><div class="actions" style="margin-top:15px"><label class="toggle"><input id="scaffold" type="checkbox" ${st.help>0?'checked':''}>考えるヒントを表示</label><button class="btn soft" id="strongHelp" type="button">${st.help===2?'例を減らす':'もっと例を見る'}</button></div>${st.lens?`<section class="question-card" style="margin-top:15px"><div class="eyebrow">${escapeHtml(lens().en)} / ${escapeHtml(lens().jp)}</div><p id="sample">${escapeHtml(qsample(st.lens))}</p>${helpPanel()}<div class="actions"><button type="button" class="btn main" id="addSample">＋ この問いをストック</button></div></section>`:`<div class="tip">👆 まずは「なぜ」「だれ」「どうすれば」など、好きなカードを選ぼう。</div>`}<details class="details" style="margin-top:14px"><summary>自分の言葉で問いを作る（任意）</summary><label for="ownQ">気になる問いを書こう</label><textarea id="ownQ" placeholder="例：なぜ昼休みの過ごし方は人によって違うの？" maxlength="300">${escapeHtml(st.draft)}</textarea><button type="button" id="addOwn" class="btn soft" style="margin-top:9px">＋ 自分の問いをストック</button></details><div id="added" role="status" class="status"></div>${questionsList(false)}${buttons()}`);
el.querySelectorAll('[data-lens]').forEach(b=>b.addEventListener('click',()=>{st.lens=b.dataset.lens;render()}));const check=el.querySelector('#scaffold');check.addEventListener('change',e=>{st.help=e.target.checked?1:0;render()});el.querySelector('#strongHelp').addEventListener('click',()=>{st.help=st.help===2?1:2;render()});const add=el.querySelector('#addSample');if(add)add.addEventListener('click',()=>{addQ(qsample(st.lens),st.lens)});let own=el.querySelector('#ownQ');own.addEventListener('input',()=>st.draft=own.value);el.querySelector('#addOwn').addEventListener('click',()=>{const val=own.value.trim();if(!val){el.querySelector('#added').textContent='自分の問いを書いてから追加してください。';return}addQ(val,st.lens||'free');st.draft=''});bindDelete();nav()}
function addQ(text,type){if(st.questions.some(x=>x.text===text)){const msg=el.querySelector('#added');if(msg)msg.textContent='この問いはすでにストックされています。';return}st.questions.push({text,type});render();const msg=el.querySelector('#added');if(msg)msg.textContent='問いを1つストックしました！'}
function questionsList(selectable){if(!st.questions.length)return `<div class="empty" style="margin-top:14px">まだ問いがありません。5W1Hのカードから問いを集めてみよう。</div>`;return `<div style="margin-top:17px"><strong>📚 問いのストック（${st.questions.length}）</strong>${st.questions.map((x,i)=>`<div class="attempt"><div class="grow"><small>${escapeHtml(lenses.find(y=>y.id===x.type)?.en||'自由な問い')}</small><b>${escapeHtml(x.text)}</b></div>${selectable?`<button class="btn ${st.chosen===i?'soft':''}" data-select="${i}" type="button">${st.chosen===i?'✓ 選択中':'選ぶ'}</button>`:`<button class="btn" data-delete="${i}" type="button" aria-label="問いを削除">削除</button>`}</div>`).join('')}</div>`}
function bindDelete(){el.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.delete;st.questions.splice(i,1);if(st.chosen===i)st.chosen=-1;else if(st.chosen>i)st.chosen--;st.selected=st.selected.filter(n=>n!==i).map(n=>n>i?n-1:n);st.reflectionEdited=false;render()}))}
function develop(){const has=st.questions.length>0;if(st.chosen>=st.questions.length)st.chosen=-1;el.innerHTML=layout('STEP 3 / 4','問いを育ててみよう','気になった問いを選び、別の角度から見直すと、より調べたくなる問いに変わるかもしれません。',`${questionsList(true)}<div class="tip">${has?'好きな問いを一つ選ぼう。選ぶのが難しければ、いちばん「なぜ？」と思うものから。':'前の画面で問いを集めよう。まだ難しければ、下の「例の問いを使う」で進められます。'}</div>${!has?`<button class="btn soft" id="exampleQ">＋ 例の問いを使う</button>`:''}<div class="line" style="border-top:1px solid var(--edge);margin:19px 0"></div><h3 class="heading" style="font-size:19px">見方を変えるスイッチ</h3><div class="grid">${['もし条件が変わったら？','違う立場の人なら？','どうすれば確かめられる？'].map((x,i)=>`<button class="choice" type="button" data-grow="${i}" aria-pressed="false">${x}</button>`).join('')}</div><div id="grown" aria-live="polite"></div><details class="details" style="margin-top:15px"><summary>メモする（任意）</summary><textarea id="memo" maxlength="1000" placeholder="考えが変わったところなどを残せます">${escapeHtml(st.memo)}</textarea></details>${buttons()}`);el.querySelectorAll('[data-select]').forEach(b=>b.addEventListener('click',()=>{st.chosen=+b.dataset.select;render()}));const e=el.querySelector('#exampleQ');if(e)e.addEventListener('click',()=>{st.questions.push({text:qsample('why'),type:'why'});st.chosen=0;render()});el.querySelectorAll('[data-grow]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.grow;const source=st.chosen>=0?st.questions[st.chosen].text:qsample('why');const refined= ['もし時間や場所が変わったら、'+source,'違う立場の人はどう考えるのだろう？ '+source,'この問いの答えを確かめるには、何を比べればよいのだろう？'][i];el.querySelectorAll('[data-grow]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));el.querySelector('#grown').innerHTML=`<div class="help"><b>新しい見方から生まれる問い</b><p>${escapeHtml(refined)}</p><button class="btn soft" id="addGrown">＋ ストックに追加</button></div>`;el.querySelector('#addGrown').onclick=()=>{addQ(refined,'free')};}));const memo=el.querySelector('#memo');if(memo)memo.addEventListener('input',()=>st.memo=memo.value);nav()}
function selectedQuestions(){return st.selected.filter(i=>i>=0&&i<st.questions.length).map(i=>st.questions[i])}
function combineQuestions(){
 const chosen=selectedQuestions();if(!chosen.length)return '';
 if(chosen.length===1)return chosen[0].text;
 const ids=new Set(chosen.map(q=>q.type));const topic=name();
 // 「問いの切り口」を組み合わせた編集可能な例。問い同士の因果関係は断定しない。
 const parts=[];
 if(ids.has('who'))parts.push('だれの立場で考えると');
 if(ids.has('when'))parts.push('いつ');
 if(ids.has('where'))parts.push('どこで');
 let focus='どんな違いや発見があるのだろう？';
 if(ids.has('why')&&ids.has('how'))focus='なぜ課題が起こり、どうすればよりよくできるのだろう？';
 else if(ids.has('why')&&ids.has('what'))focus='何が大切で、なぜそうなるのだろう？';
 else if(ids.has('when')&&ids.has('why'))focus='なぜ違いが生まれるのだろう？';
 else if(ids.has('where')&&ids.has('why'))focus='なぜ違いが生まれるのだろう？';
 else if(ids.has('why'))focus='なぜそうなるのだろう？';
 else if(ids.has('how')&&ids.has('what'))focus='何を変えれば、どのようによくなるのだろう？';
 else if(ids.has('how'))focus='どうすればよりよくできるのだろう？';
 else if(ids.has('what'))focus='何が大切なのだろう？';
 else if(ids.has('when')||ids.has('where')||ids.has('who'))focus='何が違うのだろう？';
 const front=parts.length?parts.join('、')+'、':'';
 return `「${topic}」について、${front}${focus}`;
}
function result(){
 st.selected=st.selected.filter((n,i,a)=>n>=0&&n<st.questions.length&&a.indexOf(n)===i);
 if(!st.selected.length&&st.questions.length)st.selected=[st.chosen>=0&&st.chosen<st.questions.length?st.chosen:0];
 const options=st.questions.length?st.questions.map((q,i)=>`<button type="button" class="selected-q" data-final-select="${i}" aria-pressed="${st.selected.includes(i)}"><small>${escapeHtml(lenses.find(y=>y.id===q.type)?.en||'自由な問い')}</small>${escapeHtml(q.text)}</button>`).join(''):'<div class="empty">ストックがありません。下の「もっと問いを出す」で追加できます。</div>';
 const synthesized=combineQuestions();
 if(!st.reflectionEdited)st.reflection=synthesized;
 el.innerHTML=layout('STEP 4 / 4','問いを組み合わせて、探究の問いをつくろう','気になる問いを2つ以上選んでみよう。選んだ切り口を組み合わせた例が表示されます。自分の言葉に直して完成させよう。',
 `<span class="badge">今回のお題：${escapeHtml(name())}</span><div class="sections" style="margin-top:12px"><span class="counter">集めた問い：${st.questions.length}個</span><span class="counter">選択中：<b id="selectedCount">${st.selected.length}</b>個</span></div><h3 class="heading" style="font-size:19px">① 組み合わせたい問いを選ぼう（複数選択OK）</h3><div id="finalOptions">${options}</div><p class="notice">タップで選択・解除できます。選ぶ順番は自由です。</p><div class="tip" id="combinationHint">${st.selected.length<2?'💡 もう1つ選ぶと、複数の問いを組み合わせられます。':'💡 '+st.selected.length+'つの問いの視点を組み合わせています。'}</div><h3 class="heading" style="font-size:19px">② 問いを組み合わせてみよう</h3><div class="help"><b>選んだ問いからつくった例</b><div class="question-big" id="combinedPreview">${escapeHtml(synthesized||'上の問いを選ぶと、ここに例が表示されます。')}</div><p class="notice">※自動作成は問いの切り口をまとめた例です。元の問いの細かな意味が反映されない場合は、自分の言葉で調整してください。</p></div><label for="finalQ">③ 自分たちの最終的な問い（自由に書き直せます）</label><textarea id="finalQ" maxlength="500" placeholder="例をもとに、知りたいことがはっきりする問いにしよう">${escapeHtml(st.reflection)}</textarea><div class="actions"><button type="button" class="btn soft" id="useExample">組み合わせ例を入力欄に反映</button></div><div class="help"><b>完成前に確かめよう</b><div>① 選んだ問いのよいところが生きている？ ② 調べたり確かめたりできる？ ③ 自分が本当に知りたいこと？</div></div><div class="actions"><button class="btn" id="copy">結果をコピー</button><button class="btn" id="save">テキストを保存</button><button class="btn soft" id="backMore">← もっと問いを出す</button></div><div id="resultStatus" class="status" role="status"></div>${buttons()}`);
 const tx=el.querySelector('#finalQ');
 tx.addEventListener('input',()=>{st.reflection=tx.value;st.reflectionEdited=true});
 el.querySelectorAll('[data-final-select]').forEach(btn=>btn.addEventListener('click',()=>{
 const i=+btn.dataset.finalSelect;st.selected=st.selected.includes(i)?st.selected.filter(n=>n!==i):[...st.selected,i];
 const merged=combineQuestions();
 btn.setAttribute('aria-pressed',String(st.selected.includes(i)));
 el.querySelector('#selectedCount').textContent=st.selected.length;
 el.querySelector('#combinationHint').textContent=st.selected.length<2?'💡 2つ以上選ぶと、複数の問いを組み合わせられます。':`💡 ${st.selected.length}つの問いの視点を組み合わせています。`;
 el.querySelector('#combinedPreview').textContent=merged||'上の問いを選ぶと、ここに例が表示されます。';
 if(!st.reflectionEdited){st.reflection=merged;tx.value=merged}
 }));
 el.querySelector('#useExample').onclick=()=>{st.reflection=combineQuestions();st.reflectionEdited=false;tx.value=st.reflection;tx.focus()};
 el.querySelector('#copy').onclick=async()=>{const txt=exportText(tx.value);try{await navigator.clipboard.writeText(txt);el.querySelector('#resultStatus').textContent='コピーしました。'}catch{tx.focus();tx.select();el.querySelector('#resultStatus').textContent='コピーできない環境です。上の欄を選択してコピーしてください。'}};
 el.querySelector('#save').onclick=()=>{const blob=new Blob([exportText(tx.value)],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='toi-discovery-v3.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
 el.querySelector('#backMore').onclick=()=>go(1);nav();
}
function exportText(text){return ['問いの発見ラボ Ver.3.1','お題：'+name(),'','集めた問い：',...st.questions.map((x,i)=>`${i+1}. ${x.text}`),'','最終候補に選んだ問い：',...selectedQuestions().map((x,i)=>`${i+1}. ${x.text}`),'','組み合わせ例：'+combineQuestions(),'','最終的な問い：'+(text.trim()||combineQuestions()),st.memo?'メモ：'+st.memo:''].join('\n')}
function render(){toolbar();if(st.page===0)intro();else if(st.page===1)lensesPage();else if(st.page===2)develop();else result()}
render();
})();
</script>
</body></html>
